# so101-vla stage 01 — validate an SO-101 LeRobot dataset and publish it to a stable S3
# prefix that stages 02-04 read.
#
#   osmo workflow submit osmo-on-aws/003-workflows/so101-vla/01_prepare_dataset.yaml \
#     --set storage_url=s3://<bucket>/so101-vla \
#           dataset_url=s3://<bucket>/so101-vla/raw/<name>/ \
#           dataset_name=<name> dataset_size_gi=<size>
#
# One `--set` takes every override. Repeating the flag is not an error and is not
# additive — only the last group survives, and the run proceeds with the placeholder
# defaults below.
#
# `localpath:` paths are resolved relative to this file, so that works from the repo
# root with no `cd`.
#
# Flow, in order:
#
#   acquire (s3 or hf)  ->  read codebase_version from the dataset
#   ->  model=gr00t-n17 only: install toolchain, downgrade v3 -> v2 if needed,
#       ensure meta/modality.json
#   ->  validate (agnostic core, then per-model)  ->  publish
#
# Acquisition and validation are model-agnostic; only the middle block is not. So
# `--set model=none` never installs the ~16 GB GR00T toolchain and never rewrites the
# dataset — the path to use for a LeRobot-native policy, which reads v3 directly.
#
# The dataset's format is detected, not declared: v2 and v3 are both valid inputs, and
# taking the version as an argument would let a wrong flag mangle an already-converted
# dataset or silently train on the wrong layout.
#
# The model seam is a conditional rather than per-model includes because OSMO's Jinja
# has no file loader: `{% include %}` is not rendered and dies in the YAML parse.
# Per-model *scripts* are fine — see `files:` below.

default-values:
  # gr00t-n17 | none
  model: gr00t-n17
  # s3 | hf
  dataset_source: s3

  # s3: prefix holding data/, videos/, meta/.
  dataset_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-vla/raw/so101-sample/
  # hf: Hub repo id.
  dataset_repo_id: izuluaga/finish_sandwich

  # Names the published prefix, so several recordings can coexist.
  dataset_name: so101-sample
  storage_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-vla

  # `storage` is scheduled, so both directions fail: under-request and kubelet evicts
  # the pod, over-request and the submit is rejected for exceeding the node.
  #
  # dataset_size_gi: dataset size rounded up.
  # dataset_copies: how many times it is held on disk at once. 3 covers the worst case,
  #   a v3 -> v2 downgrade, which keeps the original alongside the converted tree. Drop
  #   to 1 for an already-v2 dataset on the s3 path, where publishing is a rename
  #   because input and output share a filesystem.
  # install_storage_gi: toolchain room. GR00T's clone + .venv need ~20 GB; drop to 5
  #   for model=none, which installs nothing.
  dataset_size_gi: 1
  dataset_copies: 3
  install_storage_gi: 25

  # Assertions, not configuration: a dataset that disagrees is one worth stopping on.
  # expected_episodes: 0 skips that check.
  expected_episodes: 0
  expected_state_dim: 6

  prep_platform: l40s

  # Base image. GR00T is installed into it at runtime by files/gr00t/install_n17.sh,
  # not baked in — see that file for why.
  image: nvcr.io/nvidia/pytorch:25.04-py3

workflow:
  name: so101-prepare-dataset
  resources:
    prep:
      # Nothing here needs a GPU and none is requested. A GPU platform is used anyway
      # because it is the only one with spare CPU in the reference pool — and a platform
      # that sets `USER_GPU` in `default_variables` grants a GPU regardless, since OSMO
      # reads `gpu: 0` as absent rather than as an override. Point `prep_platform` at a
      # CPU platform if the cluster has one with >= 2 spare vCPU (`cpu` must be an
      # integer, and the osmo-ctrl sidecar adds a fixed 1).
      platform: "{{ prep_platform }}"
      cpu: 4
      memory: 32Gi
      storage: {{ install_storage_gi + dataset_size_gi * dataset_copies }}Gi
  tasks:
  - name: prepare
    image: "{{ image }}"
    resource: prep
{% if dataset_source == 's3' %}
    inputs:
    - url: {{ dataset_url }}
{% endif %}
    outputs:
    - url: {{ storage_url }}/dataset/{{ dataset_name }}/
    # localpath keeps these single-sourced and lintable. Files only — not directories.
    files:
    - localpath: files/validate_common.py
      path: /tmp/validate_common.py
{% if model == 'gr00t-n17' %}
    - localpath: files/gr00t/install_n17.sh
      path: /tmp/install_n17.sh
    # Must land beside validate_gr00t.py, which imports it from its own directory.
    - localpath: files/gr00t/so101_config.py
      path: /tmp/so101_config.py
    - localpath: files/gr00t/validate_gr00t.py
      path: /tmp/validate_gr00t.py
{% endif %}
    command: [bash, -c]
    args:
      - |
        set -euo pipefail

        # OSMO does not validate s3 output URLs at submit time, so without this a
        # forgotten --set fails at upload, after the whole run.
        case "{{ storage_url }}" in
          *REPLACE-WITH-YOUR-DATASETS-BUCKET*)
            echo "ERROR: pass --set storage_url=s3://<your-datasets-bucket>/so101-vla" >&2
            exit 2 ;;
        esac

        # ffmpeg is required, not convenience: the NGC base ships none, and both the
        # agnostic decode check and torchcodec (GR00T's only video backend) need it.
        # Ubuntu 24.04's ffmpeg 6.x is inside torchcodec's supported 4-7 range — it
        # rejects 8 — and decodes the AV1 that LeRobot records by default.
        # git-lfs only matters on the hf path, where its absence yields LFS pointer
        # files instead of parquet and fails much later.
        apt-get update -qq
        apt-get install -y -qq git git-lfs ffmpeg
        ffmpeg -version | head -1

        # --- acquire (no model toolchain involved) ---------------------------------
{% if dataset_source == 's3' %}
        # Find the root by the file that must exist, rather than assuming nesting depth.
        INFO="$(find {{input:0}} -name info.json -path '*/meta/*' | head -1)"
        if [ -z "$INFO" ]; then
          echo "ERROR: no meta/info.json under {{input:0}} — is {{ dataset_url }} a LeRobot dataset root?" >&2
          find {{input:0}} -maxdepth 3 >&2
          exit 1
        fi
        DS="$(dirname "$(dirname "$INFO")")"
{% else %}
        # Clone rather than let the downgrade script fetch: acquiring first is what makes
        # the version detectable below, and keeps this step identical for every model.
        git lfs install
        git clone --quiet "https://huggingface.co/datasets/{{ dataset_repo_id }}" \
          "/tmp/acquired/{{ dataset_repo_id }}"
        DS="/tmp/acquired/{{ dataset_repo_id }}"
{% endif %}
        echo "dataset root: ${DS}"
        du -sh "${DS}"
        # The storage formula assumes these two share a filesystem, making the publish
        # `mv` a rename. Logged so a change in OSMO's volume layout shows up here rather
        # than as a pod eviction.
        echo "input fs=$(stat -c %d "${DS}")  output fs=$(stat -c %d {{output}})"

        # Read the version off the dataset instead of taking it as an argument: a
        # mismatched flag would either mangle an already-converted dataset or silently
        # train on the wrong layout.
        DS_VERSION="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['codebase_version'])" "${DS}/meta/info.json")"
        echo "codebase_version: ${DS_VERSION}"

{% if model == 'gr00t-n17' %}
        # --- GR00T-specific dataset adaptation ------------------------------------
        # Both steps below need the Isaac-GR00T checkout, which is why the toolchain is
        # installed here and not during acquisition: nothing above this line is
        # GR00T-specific, so model=none never pays for it.
        # Exports GROOT_DIR, and puts the venv on PATH.
        source /tmp/install_n17.sh

        # GR00T reads a v2 flavour, so downgrade v3 in place. Driven by the detected
        # version: the script itself refuses a source that is not v3.0, and it keeps the
        # original alongside the result, which is what dataset_copies accounts for.
        case "${DS_VERSION}" in
          v3*)
            echo "downgrading ${DS_VERSION} -> v2.1"
            ( cd "${GROOT_DIR}" && uv run --project scripts/lerobot_conversion \
                python scripts/lerobot_conversion/convert_v3_to_v2.py \
                --repo-id "$(basename "${DS}")" --root "$(dirname "${DS}")" )
            ;;
          v2*) echo "already ${DS_VERSION}; no downgrade needed" ;;
          *)   echo "ERROR: unsupported codebase_version ${DS_VERSION}" >&2; exit 1 ;;
        esac

        # modality.json is GR00T-specific and absent from a stock LeRobot dataset.
        if [ ! -f "${DS}/meta/modality.json" ]; then
          cp "${GROOT_DIR}/examples/SO100/modality.json" "${DS}/meta/modality.json"
          echo "installed meta/modality.json from upstream examples/SO100"
        fi
{% endif %}

        # --- validate --------------------------------------------------------------
        # Runs on the image's system python: stdlib + ffmpeg, no venv needed.
        DS="${DS}" \
        EXPECT_EPISODES="{{ expected_episodes }}" \
        EXPECT_STATE_DIM="{{ expected_state_dim }}" \
          python3 /tmp/validate_common.py

{% if model == 'gr00t-n17' %}
        cd "${GROOT_DIR}"
        DS="${DS}" python /tmp/validate_gr00t.py
{% endif %}

        # `mv`, not `cp`: the input copy has no further use, so this avoids a second
        # full-size write.
        for d in data videos meta; do
          mv "${DS}/${d}" {{output}}/
        done

        # Required, and the failure it prevents is silent. The task runs as root while
        # the sidecar that uploads runs unprivileged, so anything written via tempfile
        # (how GR00T writes its stats files) is mode 0600 and unreadable to it. OSMO logs
        # the per-file permission errors, then reports "All Outputs Uploaded" and marks
        # the task COMPLETED — so without this, files go missing and nothing says so.
        chmod -R a+rX {{output}}

        echo "published to {{ storage_url }}/dataset/{{ dataset_name }}/"
        ls -la {{output}} {{output}}/meta
        du -sh {{output}}
        # Check the published prefix against this count; see the chmod note above.
        echo "files to upload: $(find {{output}} -type f | wc -l)"
