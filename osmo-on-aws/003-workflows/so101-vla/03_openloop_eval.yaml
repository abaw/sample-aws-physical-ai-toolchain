# so101-vla stage 03 — replay held-out trajectories through a fine-tuned checkpoint and
# compare predicted actions against ground truth, offline. This is the stop/go gate
# before a policy drives a real arm.
#
# How to submit it, and how to read the plots and metrics.json: README.md in this
# directory. Requires an `HF_TOKEN` credential, as stage 02 does — the checkpoint
# carries the action head, but the VLM processor is still fetched at load time.

default-values:
  model: gr00t-n17

  # Stage 01's published dataset, and one checkpoint from a stage 02 run.
  #
  # Name a single `checkpoint-<step>/` prefix. Pointing checkpoint_url at the whole run
  # prefix also works, but that prefix holds every retained checkpoint at ~24 Gi each,
  # and all of them are downloaded before the task starts.
  dataset_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-vla/dataset/so101-sample/
  checkpoint_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-vla/checkpoints/gr00t-n17/REPLACE-WITH-A-RUN-ID/checkpoint-REPLACE-WITH-A-STEP/
  storage_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-vla

  # Only meaningful when checkpoint_url is a whole run prefix: which checkpoint-<step>
  # inside it to load. Leave empty otherwise.
  checkpoint_step: ""

  # --- what to evaluate ------------------------------------------------------
  # Space-separated episode indices. Use episodes the fine-tune did not train on.
  traj_ids: "0 1 2"
  # Capped by the trajectory length, so a large value just means "the whole episode".
  steps: 400
  # Steps of each predicted chunk executed before re-planning. Must not exceed the
  # chunk length the checkpoint was trained with, and it is the same knob stage 04
  # trades against network round-trip time — so evaluate here at the value you intend
  # to drive the arm with.
  execution_horizon: 16
  # Diffusion denoising steps. Fewer is faster and slightly less accurate; this is the
  # other half of stage 04's latency budget. Raising it does NOT smooth the output —
  # measured flat from 4 to 32 while latency grew fivefold.
  denoising_steps: 4

  # --- smoothness ------------------------------------------------------------
  # One trajectory is enough: jitter is a property of the policy, not of the episode.
  smoothness_traj_id: 0
  smoothness_steps: 160
  # Warn above this worst-joint direction-reversal fraction. Teleop recordings sit under
  # 0.01. A policy above ~0.25 needs stage 04's command deadband, or it will heat a servo
  # without moving the arm.
  smoothness_warn_reversals: 0.25

  # --- resources -------------------------------------------------------------
  eval_platform: l40s
  # `cpu` must be an integer, and the osmo-ctrl sidecar adds a fixed 1 vCPU on top.
  eval_cpu: 4
  eval_memory_gi: 32
  # Toolchain venv (~15 Gi) + base model pulled by the processor (~15 Gi) + the
  # dataset + the checkpoint. A stage 02 checkpoint is ~24 Gi; raise
  # checkpoint_size_gi if checkpoint_url names a whole run prefix.
  dataset_size_gi: 1
  checkpoint_size_gi: 25
  eval_storage_gi: 40

  image: nvcr.io/nvidia/pytorch:25.04-py3

  exec_timeout: 2h

workflow:
  name: so101-{{ model }}-openloop-eval
  resources:
    eval:
      platform: "{{ eval_platform }}"
      gpu: 1
      cpu: {{ eval_cpu }}
      memory: {{ eval_memory_gi }}Gi
      storage: {{ eval_storage_gi + dataset_size_gi + checkpoint_size_gi }}Gi
  tasks:
  - name: openloop-eval
    image: "{{ image }}"
    resource: eval
    credentials:
      huggingface_token:
        HF_TOKEN: token
    inputs:
    - url: {{ dataset_url }}
    - url: {{ checkpoint_url }}
    outputs:
    - url: {{ storage_url }}/openloop/{{ model }}/{{workflow_id}}/
    files:
    - localpath: files/gr00t/install_n17.sh
      path: /tmp/install_n17.sh
    - localpath: files/gr00t/measure_smoothness.py
      path: /tmp/measure_smoothness.py
    command: [bash, -c]
    args:
      - |
        set -euo pipefail

        # Output URLs are not validated at submit time, so without this a forgotten
        # --set fails at upload, after the whole run. checkpoint_url needs no guard: it
        # is an input, so a placeholder fails at download before this script runs.
        case "{{ storage_url }}" in
          *REPLACE-WITH-*)
            echo "ERROR: pass --set storage_url=s3://<your-datasets-bucket>/so101-vla" >&2
            exit 2 ;;
        esac

        # The base image ships no ffmpeg and the video backend cannot decode without one.
        # git-lfs is needed too — see files/gr00t/install_n17.sh.
        apt-get update -qq
        apt-get install -y -qq git git-lfs ffmpeg

        # Exports GROOT_DIR and puts the venv on PATH.
        source /tmp/install_n17.sh

        # Find the root by the file that must exist, rather than assuming nesting depth.
        INFO="$(find {{input:0}} -name info.json -path '*/meta/*' -print -quit)"
        if [ -z "$INFO" ]; then
          echo "ERROR: no meta/info.json under {{input:0}} — is {{ dataset_url }} a prepared dataset prefix?" >&2
          find {{input:0}} -maxdepth 3 >&2
          exit 1
        fi
        DS="$(dirname "$(dirname "$INFO")")"
        echo "dataset root: ${DS}"

{% if checkpoint_step %}
        CKPT="$(find {{input:1}} -type d -name 'checkpoint-{{ checkpoint_step }}' -print -quit)"
{% else %}
        # A single checkpoint prefix is already a model directory; a run prefix holds them
        # as subdirectories. -V because a lexical sort puts checkpoint-900 after
        # checkpoint-1000.
        if [ -f "{{input:1}}/config.json" ]; then
          CKPT="{{input:1}}"
        else
          CKPT="$(find {{input:1}} -type d -name 'checkpoint-*' | sort -V | tail -1)"
        fi
{% endif %}
        if [ -z "${CKPT}" ]; then
          echo "ERROR: no matching checkpoint-<step> directory under {{input:1}}" >&2
          find {{input:1}} -maxdepth 3 -type d >&2
          exit 1
        fi
        echo "checkpoint: ${CKPT}"

        # A checkpoint without normalization statistics loads without complaint and then
        # predicts at the wrong scale, which looks like a bad fine-tune. Name the real
        # cause instead.
        if [ ! -f "${CKPT}/experiment_cfg/dataset_statistics.json" ]; then
          echo "ERROR: ${CKPT} has no experiment_cfg/dataset_statistics.json — the training run did not publish a complete checkpoint" >&2
          exit 1
        fi

        # Upload is where a checkpoint silently loses files, and stage 02 cannot check its
        # own upload, so it ships a manifest inside each checkpoint. This is the first
        # moment it can be verified. Fails immediately: nothing has been produced yet that
        # a later failure would need to explain itself with.
        python3 - "${CKPT}" <<'PY'
        import json, pathlib, sys

        ckpt = pathlib.Path(sys.argv[1])
        manifest = ckpt / "manifest.json"
        if not manifest.is_file():
            print("WARNING: %s has no manifest.json — published before stage 02 wrote one, "
                  "so upload completeness cannot be verified" % ckpt, file=sys.stderr)
            sys.exit(0)

        listed = json.loads(manifest.read_text())
        missing, truncated = [], []
        for entry in listed["files"]:
            path = ckpt / entry["path"]
            if not path.is_file():
                missing.append(entry["path"])
            elif path.stat().st_size != entry["bytes"]:
                truncated.append(entry["path"])

        if missing or truncated:
            print("ERROR: checkpoint does not match its manifest — %d of %d files missing, "
                  "%d wrong size. Missing: %s. Wrong size: %s"
                  % (len(missing), listed["file_count"], len(truncated),
                     missing[:10], truncated[:10]), file=sys.stderr)
            sys.exit(1)
        print("manifest verified: %d files, %d bytes"
              % (listed["file_count"], listed["total_bytes"]))
        PY

        mkdir -p {{output}}/plots

        # --save-plot-path names a single file, so several trajectories would overwrite
        # each other. Left unset, the eval writes one plot per trajectory here.
        PLOT_DIR=/tmp/open_loop_eval
        rm -rf "${PLOT_DIR}"

        cd "${GROOT_DIR}"
        # pipefail is set, so a failing eval still fails the task despite the tee.
        python gr00t/eval/open_loop_eval.py \
          --dataset-path "${DS}" \
          --embodiment-tag NEW_EMBODIMENT \
          --model-path "${CKPT}" \
          --traj-ids {{ traj_ids }} \
          --execution-horizon {{ execution_horizon }} \
          --denoising-steps {{ denoising_steps }} \
          --steps {{ steps }} 2>&1 | tee {{output}}/openloop_eval.log

        # Smoothness, which the error metrics above cannot see. A zero-mean oscillation on
        # a broadly correct trajectory scores well on MSE and MAE, and on a real arm it is
        # what makes a joint overheat — so it gets its own number rather than being left to
        # be discovered by hardware.
        python -u /tmp/measure_smoothness.py "${DS}" "${CKPT}" \
          {{ smoothness_traj_id }} {{ smoothness_steps }} {{ denoising_steps }} \
          2>&1 | tee {{output}}/smoothness.log || echo "SMOOTHNESS_FAILED"
        grep RESULTS_JSON {{output}}/smoothness.log \
          | sed 's/^RESULTS_JSON //' > {{output}}/smoothness.json || true

        # Copy whatever plots exist instead of letting an unmatched glob fail the task.
        # The numbers are the gate; the plots are how a human reads it.
        cp "${PLOT_DIR}"/*.jpeg {{output}}/plots/ 2>/dev/null || true

        # Errors are reported only in the log, so both artifacts are parsed out of it:
        # metrics.json for a caller, metrics.txt for a person.
        #
        # Gate on `complete`, which is not the same question as whether the task
        # succeeded: out-of-range trajectory IDs are skipped with a warning and the eval
        # still exits 0, so a typo silently shrinks the sample it averages over.
        METRICS_RC=0
        python3 - {{output}} "{{ traj_ids }}" "{{ checkpoint_url }}" "${CKPT}" {{ smoothness_warn_reversals }} <<'PY' || METRICS_RC=$?
        import json, pathlib, re, sys

        out = pathlib.Path(sys.argv[1])
        requested = [int(t) for t in sys.argv[2].split()]
        log = (out / "openloop_eval.log").read_text(errors="replace")

        # The source URL, not the local path: inputs are downloaded to a numbered
        # directory, so the path says nothing about which run or step was scored. The
        # step comes from the checkpoint itself, and is absent from a final export.
        state = pathlib.Path(sys.argv[4]) / "trainer_state.json"
        global_step = None
        if state.is_file():
            global_step = json.loads(state.read_text()).get("global_step")

        def num(text):
            try:
                return float(text)
            except ValueError:
                return None

        # Last occurrence wins, so a re-run of a trajectory within one log is not double
        # counted.
        per_traj = {}
        for tid, mse, mae in re.findall(
            r"MSE for trajectory (\d+): (\S+?), MAE: (\S+)", log
        ):
            per_traj[int(tid)] = dict(traj_id=int(tid), mse=num(mse), mae=num(mae.rstrip(",")))

        def avg(label):
            m = re.search(r"Average %s across all trajs: (\S+)" % label, log)
            return num(m.group(1)) if m else None

        evaluated = sorted(t for t, v in per_traj.items() if v["mse"] is not None)
        missing = [t for t in requested if t not in evaluated]
        # Smoothness, if it was produced. Reported beside the error metrics because the two
        # answer different questions and only one of them is visible in the plots.
        smoothness = None
        smooth_path = out / "smoothness.json"
        if smooth_path.is_file() and smooth_path.stat().st_size:
            try:
                raw_smooth = json.loads(smooth_path.read_text())
                row = next(iter(raw_smooth["sweep"].values()))
                smoothness = dict(
                    worst_reversals=row["worst_reversals"],
                    ground_truth_worst_reversals=max(
                        v["reversals"] for v in raw_smooth["ground_truth"].values()
                    ),
                    per_joint={k: v["reversals"] for k, v in row["joints"].items()},
                )
            except (ValueError, KeyError, StopIteration) as exc:
                print("WARNING: could not read smoothness.json: %r" % exc, file=sys.stderr)

        result = dict(
            checkpoint_url=sys.argv[3],
            global_step=global_step,
            requested_traj_ids=requested,
            evaluated_traj_ids=evaluated,
            missing_traj_ids=missing,
            per_trajectory=[per_traj[t] for t in evaluated],
            average_mse=avg("MSE"),
            average_mae=avg("MAE"),
            plot_count=len(list((out / "plots").glob("*.jpeg"))),
            smoothness=smoothness,
            complete=not missing and avg("MSE") is not None,
        )
        (out / "metrics.json").write_text(json.dumps(result, indent=2) + "\n")

        lines = [
            "checkpoint: %s (step %s)" % (result["checkpoint_url"], global_step),
            "trajectories requested: %s" % requested,
            "trajectories evaluated: %s" % evaluated,
        ]
        lines += ["traj %d: MSE %s, MAE %s" % (t["traj_id"], t["mse"], t["mae"])
                  for t in result["per_trajectory"]]
        lines += ["average MSE: %s" % result["average_mse"],
                  "average MAE: %s" % result["average_mae"]]
        if smoothness:
            lines.append(
                "worst-joint direction reversals: %.1f%% (ground truth %.1f%%)"
                % (smoothness["worst_reversals"] * 100,
                   smoothness["ground_truth_worst_reversals"] * 100)
            )
        (out / "metrics.txt").write_text("\n".join(lines) + "\n")
        print("\n".join(lines))

        # Loud, and deliberately not a failure: a jittery policy is still drivable, but only
        # with stage 04's command deadband. Silence here is what let it reach hardware.
        if smoothness and smoothness["worst_reversals"] > float(sys.argv[5]):
            print(
                "WARNING: this checkpoint's action chunks reverse direction on %.0f%% of "
                "steps at their worst joint, against %.1f%% for the trajectory it imitates. "
                "The arm will do servo work without moving. Drive it with stage 04's "
                "command_deadband_deg set, and watch servo temperature."
                % (smoothness["worst_reversals"] * 100,
                   smoothness["ground_truth_worst_reversals"] * 100),
                file=sys.stderr,
            )

        if not result["complete"]:
            print("INCOMPLETE: requested %s, evaluated %s — trajectory IDs out of range "
                  "for this dataset, or the eval reported no averages"
                  % (requested, evaluated), file=sys.stderr)
            sys.exit(1)
        PY

        # The task runs as root, the uploading sidecar does not, so anything written via
        # tempfile is mode 0600 and silently unreadable to it — logged as a per-file error,
        # then reported as uploaded.
        chmod -R a+rX {{output}}

        echo "published to {{ storage_url }}/openloop/{{ model }}/{{workflow_id}}/"
        ls -la {{output}} {{output}}/plots
        # Check the published prefix against this count; see the chmod note above.
        echo "files to upload: $(find {{output}} -type f | wc -l)"

        # Deliberately last: an incomplete evaluation must fail the task, but only after
        # the log, the plots and metrics.json are published and readable — otherwise
        # there is nothing to diagnose it from.
        if [ "${METRICS_RC}" -ne 0 ]; then
          echo "ERROR: evaluation did not cover every requested trajectory; see metrics.json" >&2
          exit 1
        fi
  timeout:
    exec_timeout: {{ exec_timeout }}
