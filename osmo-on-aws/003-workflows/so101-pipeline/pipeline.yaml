version: 2
# Fine-tune a vision-language-action model on SO-101 recordings, score it, and drive the arm.
# Four stages in one spec, each switched on or off by its own flag:
#
#   prepare  convert a recording into the model's format   -> dataset/<model>/<dataset_name>/
#   train    fine-tune                                     -> checkpoints/<model>/<workflow-id>/
#   eval     score offline; the stop/go gate               -> eval/<model>/<workflow-id>/
#   hil      drive the physical arm                        -> hil/<model>/<workflow-id>/
#
# Submitting: use ./submit.sh, which assembles the --set arguments and refuses a mistyped key.
#   ./submit.sh --example full-chain --model gr00t-n17 storage_url=s3://... dataset_name=...
#
# README.md covers usage, adding a model, the robot half, and how to read a result.
# docs/CONTRACT.md is what a model directory must provide. docs/SO101_POLICY_INTERFACE.md is the
# arm's own interface to a policy server, which this spec passes arguments to and does not define.
#
# THE ARM MOVES ONLY WITH allow_motion=true.
#
# A model is a directory under models/, selected by templating the path its scripts are injected
# from, so this spec never names one. Each directory provides twelve files; the helper slots may
# be empty but must exist, or the submit fails at validate naming the missing path:
#
#   install.sh           SOURCED by every stage. $1 stage (prepare|train|eval|serve)
#   prepare.sh           $1 dataset-in   $2 dir-out
#   train.sh             $1 dataset  $2 dir-out  $3 steps  $4 batch  $5 save-freq  $6 seed
#   score.sh             $1 ckpt  $2 dataset  $3 dir-out  $4 traj-ids  $5 horizon  $6 steps
#   serve.sh             $1 ckpt  $2 dataset  $3 port  $4 camera-names
#   client_transport.sh  SOURCED by the robot task; exports TRANSPORT_MODULE
#   common.py            injected into every stage        may be empty
#   prepare_lib.py       injected into prepare            may be empty
#   train_lib.py         injected into train              may be empty
#   score_lib.py         injected into eval               may be empty
#   serve_lib.py         injected into hil                may be empty
#   transport.py         injected into both hil tasks     may be empty
#
# Each script receives every argument whether it uses it or not.
default-values:
  # --- composition -----------------------------------------------------------
  # Which stages to run. Must be exactly `true` or `false`; preflight rejects anything else
  # rather than letting it read as false.
  run_prepare: true
  run_train: true
  run_eval: true
  run_hil: false

  # --- which model -----------------------------------------------------------
  # Selects models/<model>/. Never appears in a conditional.
  model: gr00t-n17
  # The image the model's scripts expect. A model needing a different base sets it — ideally
  # from models/<name>/model.vars, so adding a model still touches no existing file.
  runtime_image: public.ecr.aws/docker/library/python:3.12-slim
  # Credentials the model's scripts need. Empty means none. A gated model sets this, which is
  # what keeps "adding a model edits nothing" true for the models we actually have.
  hf_token_credential: ""

  # --- data in, artefacts out ------------------------------------------------
  storage_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/model-agnostic
  # Names the converted tree. Distinct per recording, NOT per run — see the prepare outputs.
  dataset_name: REPLACE-WITH-YOUR-DATASET-NAME
  # source_dataset_url    set when run_prepare is true
  # prepared_dataset_url  set when a stage consumes a dataset and run_prepare is false
  # checkpoint_url        set when a stage consumes a checkpoint and run_train is false
  #
  # Leave these as placeholder buckets rather than blanking them: an empty URL is rejected at
  # submit with `Unknown URI scheme:` and no variable name, whereas a placeholder fails at
  # download with `NoSuchBucket` and the URL in the message.
  source_dataset_url: s3://replace-with-your-raw-dataset-bucket/
  prepared_dataset_url: s3://replace-with-your-prepared-dataset-bucket/
  checkpoint_url: s3://replace-with-your-checkpoint-bucket/

  # --- the run ---------------------------------------------------------------
  # Model-specific knobs — learning rate, dtype, GPU count, embodiment tag, denoising steps —
  # are not here. They live in the model's own scripts or its models/<name>/model.vars.
  steps: 20000
  batch_size: 4
  save_freq: 5000
  seed: 1000
  # Use several trajectories; one is not evidence of convergence. Space-separated episode
  # indices, ideally ones the fine-tune did not train on.
  traj_ids: "3 7 11"
  execution_horizon: 16
  max_steps: 400

  # --- the robot half --------------------------------------------------------
  # NAME=SPEC per camera, ';'-separated. NAME must be the dataset's own image-feature suffix —
  # a camera has three identities (how the client opens it, the dataset key, the model's
  # internal key) and modality.json exists to map the last two, so the pipeline must not invent
  # one. SPEC is either a selector resolved against sysfs on the machine at run time, or any
  # value OpenCV accepts. PREFER A SELECTOR: /dev/videoN is assigned in enumeration order, so a
  # replug renumbers it and the run then drives on the wrong camera's frames in silence.
  # The rig is a property of the machine, so one camera or three is a configuration change;
  # joints stay fixed at six. Survey your own with:
  #   for d in /sys/class/video4linux/*; do echo "$d $(cat $d/name)"; readlink -f $d; done
  cameras: "front=sysfs:*/3-5.1/*;wrist=sysfs:*/3-1/*"
  robot_port: /dev/ttyACM0
  # THE ARM MOVES ONLY IF THIS IS true. Left false, the hil stage runs everything —
  # gang-scheduling, camera resolution, the observation round trip — and never enables torque.
  allow_motion: false
  lang_instruction: REPLACE-WITH-YOUR-TASK-DESCRIPTION

  # --- what the dataset must contain, asserted not assumed ------------------
  # Checked by the model-independent validator after conversion. A dataset that trains for
  # hours and then drives the wrong joint is the failure these two exist to prevent.
  expected_episodes: 0
  expected_state_dim: 6

  # --- the robot's safety envelope ------------------------------------------
  # Properties of the arm. No model chooses any of these. The client defaults all of them; they
  # are surfaced here so they can be tuned for a different arm without editing the client.
  # --- safety ---------------------------------------------------------------
  # Rehearsal mode: everything runs, including the policy and the full control loop, and
  # every action is logged — but torque is never enabled and nothing is sent. Run this
  # first, every time the setup changes.
  # Each arm joint's calibrated range is shrunk by this much at both ends. The calibrated
  # range is already narrower than the servo range; this keeps a clamped action away from
  # a mechanical limit.
  joint_margin_deg: 5
  gripper_margin: 3
  # Per-step ceiling on how far a joint may be commanded from where it actually is. At
  # 30 Hz the default is far above this arm's real speed, so it bounds a wild action
  # without limiting normal motion.
  max_step_deg: 8
  max_step_gripper: 15
  # Servo Acceleration and Goal_Velocity. LeRobot configures 254 for teleoperation
  # responsiveness; a policy under evaluation does not need it, and a slow bad target is
  # much better than a fast one.
  acceleration: 20
  speed: 600
  # The arm can hold a stale pose for at most (policy_retries + 1) x policy_timeout_ms —
  # 3 s here. Set the timeout above your own round-trip p99 or the run aborts on healthy
  # jitter; ~890 ms was measured here. See README.md.
  policy_timeout_ms: 1500
  policy_retries: 1
  # The ping and warm-up calls run with the arm limp and include the model's
  # first-inference cost, so they get their own, generous, ceiling.
  policy_setup_timeout_s: 300
  # How long the return-to-start move is interpolated over. Match it to how far the arm
  # actually has to travel: left short, the goal runs ahead of the arm and the return
  # happens at whatever `speed` allows rather than as a controlled ramp.
  # Holds the previous command below this threshold, suppressing the policy's dither. OFF by
  # default: it reduces per-motor work but does NOT smooth the path, and it discards
  # commanded travel. See README.md before enabling.
  command_deadband_deg: 0
  command_deadband_gripper: 0
  # At this temperature the run rests rather than stopping: the arm returns, torque comes
  # off (it cannot cool while holding a pose), and driving resumes once it is cool. Resting
  # is not driving, so a hot arm makes the run take longer in wall-clock rather than drive
  # for less of it — budget exec_timeout for that. See README.md for the servos' own limits.
  max_servo_temp_c: 55
  # One corrupted read is not a hot servo, and this bus does corrupt reads.
  temp_confirm_reads: 3
  # Well below the pause threshold. Without the gap the run would stop and start every few
  # seconds instead of actually resting.
  resume_servo_temp_c: 45
  # Failing to cool with torque off means something is still drawing current.
  cooldown_timeout_s: 600
  # Stop rather than cycle forever on an arm that cannot sustain the duty cycle.
  max_cooldowns: 20
  release_ramp_s: 2
  # Sending the last goal of the return ramp is not reaching it, and `speed` caps how fast
  # the arm can get there. Without this wait torque drops while it is still travelling and
  # the arm is left wherever it got to.
  release_settle_s: 6
  # The group is gang-scheduled, so the client starts at the same moment the server does
  # — and the server has a ~24 Gi checkpoint to download and a 3B model to load first.
  # This is how long the client keeps pinging before it gives up.
  policy_wait_s: 1800

  # Optional: six values in joint order, ramped to at the start of every interval. Without
  # it each interval starts from wherever the last one left the arm, and the policy is
  # extrapolating from a pose it never trained on.
  # A pose from the middle of your recording is a good choice — the policy has seen it.

  # Ramp to a known pose before each interval, so the policy always starts where it was trained
  # to start rather than wherever the last interval left off. Empty disables it.
  home_pose: ""
  home_ramp_s: 4

  # --- the robot's own identity and optics ----------------------------------
  robot_id: follower
  # Optional path, relative to this file, to the LeRobot calibration JSON the dataset was
  # recorded with. When given, the servos' own EEPROM is asserted equal to it.
  calibration_localpath: ""
  camera_width: 640
  camera_height: 480
  camera_fps: 30
  # Consumed per chunk before re-planning, and the rate the loop holds.
  action_horizon: 16
  control_hz: 30
  run_duration_s: 20
  interval_s: 60

  # --- the client's own toolchain, pinned -----------------------------------
  # The calibrated joint space the policy learned is defined by the LeRobot version that
  # recorded the data, so this is a correctness constraint rather than hygiene.
  client_image: public.ecr.aws/docker/library/python:3.12-slim
  lerobot_commit: 9021d2d24036e048b455d55919630e6e97394830
  torch_version: 2.10.0
  torchvision_version: 0.25.0
  pyzmq_version: 27.0.1
  msgpack_version: 1.1.0
  msgpack_numpy_version: 0.4.8

  # --- machines --------------------------------------------------------------
  gpu_platform: l40s
  robot_platform: so101-edge
  # Preflight and dataset conversion need no accelerator. Point this at a CPU-only platform if
  # your pool has one, so a large conversion does not hold a GPU.
  cpu_platform: l40s
  policy_port: 5555
  # Covers the WHOLE submission, not one stage, and a task killed by its timeout publishes
  # nothing. Rough figures: prepare 2-15 min, train 4-17 h by step count, eval ~6 min, hil
  # minutes. A full chain with a real training run wants 24h.
  exec_timeout: 4h

workflow:
  name: so101-pipeline
  resources:
    # One entry per shape of work, not per stage; several stages share a shape.
    cpu_small:
      platform: "{{ cpu_platform }}"
      cpu: 1
      memory: 4Gi
      storage: 10Gi
    cpu_data:
      platform: "{{ cpu_platform }}"
      cpu: 4
      memory: 48Gi
      storage: 250Gi
    gpu_train:
      platform: "{{ gpu_platform }}"
      gpu: 1
      cpu: 4
      memory: 48Gi
      storage: 250Gi
    gpu_infer:
      platform: "{{ gpu_platform }}"
      gpu: 1
      cpu: 4
      memory: 48Gi
      storage: 80Gi
    robot:
      platform: "{{ robot_platform }}"
      cpu: 1
      memory: 6Gi
      storage: 10Gi

  groups:
  # ==========================================================================
  # 0. PREFLIGHT — always runs, costs seconds, converts silent misconfiguration
  #    into one legible failure before anything expensive starts.
  # ==========================================================================
  - name: preflight
    tasks:
    - name: check-config
      lead: true
      image: public.ecr.aws/docker/library/python:3.12-slim
      resource: cpu_small
      command: [bash, -c]
      args:
        - |
          set -euo pipefail
          fail=0

          echo "=== resolved configuration ==="
          echo "  model            {{ model }}"
          echo "  dataset_name     {{ dataset_name }}"
          echo "  steps            {{ steps }}"
          echo "  batch_size       {{ batch_size }}"
          echo "  save_freq        {{ save_freq }}"
          echo "  seed             {{ seed }}"
          echo "  traj_ids         {{ traj_ids }}"
          echo "  execution_horiz  {{ execution_horizon }}"
          echo "  max_steps        {{ max_steps }}"
          echo "  run_prepare      {{ run_prepare | string | lower }}"
          echo "  run_train        {{ run_train | string | lower }}"
          echo "  run_eval         {{ run_eval | string | lower }}"
          echo "  run_hil          {{ run_hil | string | lower }}"
          echo "  storage_url      {{ storage_url }}"
          echo "  source_dataset   {{ source_dataset_url }}"
          echo "  prepared_dataset {{ prepared_dataset_url }}"
          echo "  checkpoint_url   {{ checkpoint_url }}"
          echo "  cameras          {{ cameras }}"
          echo "  robot_port       {{ robot_port }}"
          echo "  lang_instruction {{ lang_instruction }}"
          echo "  runtime_image    {{ runtime_image }}"
          echo "  gpu_platform     {{ gpu_platform }}"
          echo "  robot_platform   {{ robot_platform }}"
          echo "  cpu_platform     {{ cpu_platform }}"
          echo "  policy_port      {{ policy_port }}"
          echo "  exec_timeout     {{ exec_timeout }}"
          echo "  allow_motion     {{ allow_motion | string | lower }}"
          echo "=============================="
          echo "If a flag you passed is absent above, you mistyped its name: --set accepts"
          echo "unknown keys silently and nothing else will tell you."

          # Strict booleans. The Jinja guards below coerce anything unrecognised to false,
          # which would skip a stage without saying so.
          for pair in "run_prepare={{ run_prepare | string | lower }}" "run_train={{ run_train | string | lower }}" \
                      "run_eval={{ run_eval | string | lower }}" "run_hil={{ run_hil | string | lower }}" \
                      "allow_motion={{ allow_motion | string | lower }}"; do
            k="${pair%%=*}"; v="${pair#*=}"
            case "$(echo "${v}" | tr '[:upper:]' '[:lower:]')" in
              true|false) ;;
              *) echo "ERROR: ${k}='${v}' is not a boolean. Use true or false." >&2; fail=1 ;;
            esac
          done

          # Checks each URL's scheme and rejects a leftover placeholder.
          check_url() {
            local name="$1" value="$2"
            case "${value}" in
              s3://*) ;;
              *) echo "ERROR: ${name} must be an s3:// URL, got '${value}'" >&2; return 1 ;;
            esac
            case "${value}" in
              *replace-with-*|*REPLACE-WITH-*|*REPLACE/*)
                echo "ERROR: ${name} is still a placeholder: '${value}'" >&2; return 1 ;;
            esac
            return 0
          }

          check_url storage_url "{{ storage_url }}" || fail=1
          # dataset_name names the prepare stage's output prefix, so it is required only when
          # that stage runs.
{% if run_prepare | string | lower == 'true' %}
          case "{{ dataset_name }}" in
            *REPLACE-WITH-*) echo "ERROR: dataset_name is still a placeholder, and run_prepare is true" >&2; fail=1 ;;
            */*) echo "ERROR: dataset_name is a name, not a path: '{{ dataset_name }}'" >&2; fail=1 ;;
          esac
{% endif %}
          if [ "{{ run_prepare | string | lower }}" = "true" ]; then
            check_url source_dataset_url "{{ source_dataset_url }}" || fail=1
          fi
          if [ "{{ run_prepare | string | lower }}" != "true" ] \
             && { [ "{{ run_train | string | lower }}" = "true" ] \
               || [ "{{ run_eval | string | lower }}" = "true" ] \
               || [ "{{ run_hil | string | lower }}" = "true" ]; }; then
            check_url prepared_dataset_url "{{ prepared_dataset_url }}" || fail=1
          fi
          if [ "{{ run_train | string | lower }}" != "true" ] \
             && { [ "{{ run_eval | string | lower }}" = "true" ] \
               || [ "{{ run_hil | string | lower }}" = "true" ]; }; then
            check_url checkpoint_url "{{ checkpoint_url }}" || fail=1
          fi

          # A no-op submission is a mistake, not a configuration.
          if [ "{{ run_prepare | string | lower }}" != "true" ] \
             && [ "{{ run_train | string | lower }}" != "true" ] \
             && [ "{{ run_eval | string | lower }}" != "true" ] \
             && [ "{{ run_hil | string | lower }}" != "true" ]; then
            echo "ERROR: every stage is disabled; nothing would run" >&2; fail=1
          fi

          if [ "{{ run_hil | string | lower }}" = "true" ]; then
            case "{{ lang_instruction }}" in
              *REPLACE-WITH-*) echo "ERROR: run_hil needs lang_instruction" >&2; fail=1 ;;
            esac
            # Shell metacharacters would be spliced into the client's command line inside a
            # privileged container holding the servo bus.
            case "{{ lang_instruction }}" in
              *'$'*|*'`'*|*'"'*|*'\\'*)
                echo "ERROR: lang_instruction must not contain \$ \` \" or backslash" >&2; fail=1 ;;
            esac
            # Each pair, not just "contains an =". A name with a dot would make dataset-key
            # suffix resolution ambiguous; a comma or equals breaks the encoding itself.
            #
            # The NAME is checked here, not the SPEC: a spec may be a selector, a device node, an
            # OpenCV index, a video file or a URL. The client resolves it and refuses one matching
            # zero devices or several, before torque.
            seen=""
            for pair in $(echo "{{ cameras }}" | tr ';' ' '); do
              case "${pair}" in
                *=*) ;;
                *) echo "ERROR: camera '${pair}' is not <name>=<spec>" >&2; fail=1; continue ;;
              esac
              cname="${pair%%=*}"
              case "${cname}" in
                ""|*.*|*[[:space:]]*)
                  echo "ERROR: camera name '${cname}' must be non-empty and free of dots and spaces" >&2
                  fail=1 ;;
              esac
              case " ${seen} " in
                *" ${cname} "*) echo "ERROR: camera name '${cname}' is repeated" >&2; fail=1 ;;
                *) seen="${seen} ${cname}" ;;
              esac
            done
          fi

          # Where artefacts will land, and how to resume from them. {{workflow_id}} resolves
          # at runtime, so this is the only place a user can read the real prefix.
          echo "=== publishes to ==="
          echo "  dataset     {{ storage_url }}/dataset/{{ model }}/{{ dataset_name }}/  (cache, reused)"
          echo "  checkpoint  {{ storage_url }}/checkpoints/{{ model }}/{{workflow_id}}/"
          echo "  eval        {{ storage_url }}/eval/{{ model }}/{{workflow_id}}/"
          echo "  hil         {{ storage_url }}/hil/{{ model }}/{{workflow_id}}/"
          echo "to re-run a later stage against this run's artefacts:"
          echo "  --set run_prepare=false run_train=false \\"
          echo "        prepared_dataset_url={{ storage_url }}/dataset/{{ model }}/{{ dataset_name }}/ \\"
          echo "        checkpoint_url={{ storage_url }}/checkpoints/{{ model }}/{{workflow_id}}/"
          echo "to retry only the task that failed, unchanged: osmo workflow restart {{workflow_id}}"

          [ "${fail}" -eq 0 ] || { echo "preflight failed" >&2; exit 2; }
          echo "preflight passed"

{% if run_prepare | string | lower == 'true' %}
  # ==========================================================================
  # 1. PREPARE — acquire and convert to this model's format. Per-model trees, so
  #    one model's preparation cannot overwrite another's.
  # ==========================================================================
  - name: prepare
    tasks:
    - name: prepare-dataset
      lead: true
      image: "{{ runtime_image }}"
      resource: cpu_data
{% if hf_token_credential %}
      # A gated model needs this and the pipeline cannot know which; the model names the
      # credential in its model.vars. Keyed on the CAPABILITY, not on the model, so adding a
      # model still adds no branch.
      credentials:
        {{ hf_token_credential }}:
          HF_TOKEN: token
{% endif %}
      inputs:
      - url: "{{ source_dataset_url }}"
      # Keep check-config LAST in every input list, so {{input:0}} keeps meaning the dataset.
      # It is an input rather than just an earlier group because failure propagates only along
      # input edges.
      - task: check-config
      outputs:
      # Keyed by model and dataset NAME, not by run id, so the converted tree is a reusable
      # cache. Re-running prepare over an existing prefix must therefore be safe, which is an
      # obligation on the model's prepare.sh.
      - url: "{{ storage_url }}/dataset/{{ model }}/{{ dataset_name }}/"
      files:
      - localpath: models/{{ model }}/install.sh
        path: /tmp/install.sh
      # A payload that declares itself a template is rendered by OSMO's server-side pass,
      # whose scope is --set values ONLY — default-values are invisible to it. So a payload
      # referencing a workflow variable makes that variable mandatory --set input forever.
      # OSMO's own tokens are always in scope and are the safe case. See docs/CONTRACT.md.
      - localpath: models/{{ model }}/prepare.sh
        path: /tmp/prepare.sh
      # Helper slots. Mandatory, may be empty; they land beside the script so a plain
      # `import common` finds them.
      - localpath: models/{{ model }}/common.py
        path: /tmp/common.py
      - localpath: models/{{ model }}/prepare_lib.py
        path: /tmp/prepare_lib.py
      # Model-INDEPENDENT validation: episode count and state dimensionality against what the
      # submitter asserted. Runs on the prepared tree, so it checks what will be trained on.
      - localpath: ../so101-vla/files/validate_common.py
        path: /tmp/validate_common.py
      command: [bash, -c]
      args:
        - |
          set -euo pipefail
          source /tmp/install.sh prepare
          # A mistyped URL downloads nothing and the stage would otherwise succeed on an empty
          # directory, reporting COMPLETED.
          [ -n "$(find {{input:0}} -type f -print -quit)" ] \
            || { echo "ERROR: {{input:0}} is empty — check source_dataset_url" >&2; exit 1; }
          bash /tmp/prepare.sh "{{input:0}}" "{{output}}"

          # Runs after the conversion, so it checks the tree that will be trained on.
          DS="{{output}}" \
          EXPECT_EPISODES="{{ expected_episodes }}" \
          EXPECT_STATE_DIM="{{ expected_state_dim }}" \
            python3 /tmp/validate_common.py

          chmod -R a+rX {{output}}
          echo "prepared $(find {{output}} -type f | wc -l) files"
{% endif %}

{% if run_train | string | lower == 'true' %}
  # ==========================================================================
  # 2. TRAIN
  # ==========================================================================
  - name: train
    tasks:
    - name: train-model
      lead: true
{% if hf_token_credential %}
      # A gated model needs this and the pipeline cannot know which; the model names the
      # credential in its model.vars. Keyed on the CAPABILITY, not on the model, so adding a
      # model still adds no branch.
      credentials:
        {{ hf_token_credential }}:
          HF_TOKEN: token
{% endif %}
      image: "{{ runtime_image }}"
      resource: gpu_train
      inputs:
{% if run_prepare | string | lower == 'true' %}
      - task: prepare-dataset
{% else %}
      - url: "{{ prepared_dataset_url }}"
{% endif %}
      - task: check-config
      outputs:
      - url: "{{ storage_url }}/checkpoints/{{ model }}/{{workflow_id}}/"
      files:
      - localpath: models/{{ model }}/install.sh
        path: /tmp/install.sh
      - localpath: models/{{ model }}/train.sh
        path: /tmp/train.sh
      - localpath: models/{{ model }}/common.py
        path: /tmp/common.py
      - localpath: models/{{ model }}/train_lib.py
        path: /tmp/train_lib.py
      command: [bash, -c]
      args:
        - |
          set -euo pipefail
          source /tmp/install.sh train
          [ -n "$(find {{input:0}} -type f -print -quit)" ] \
            || { echo "ERROR: {{input:0}} is empty — check the dataset input" >&2; exit 1; }
          bash /tmp/train.sh "{{input:0}}" "{{output}}" {{ steps }} {{ batch_size }} {{ save_freq }} {{ seed }}

          # A manifest of files and sizes travels inside each published artifact, so a later
          # stage can tell a complete download from a truncated one. The exit status is held
          # until after publishing, so a failure still leaves its artifacts behind.
          MANIFEST_RC=0
          python3 - {{output}} <<'PY' || MANIFEST_RC=$?
          import json, pathlib, sys

          out = pathlib.Path(sys.argv[1])
          checkpoints = sorted(p for p in out.glob("checkpoint-*") if p.is_dir())

          def files_under(root, skip):
              found = []
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.name == "manifest.json":
                      continue
                  if any(str(p).startswith(str(s) + "/") for s in skip):
                      continue
                  found.append(dict(path=str(p.relative_to(root)), bytes=p.stat().st_size))
              return found

          # One manifest per artifact: a run can publish a final export and several checkpoints,
          # and each is downloaded on its own.
          # Records what was published and how big. Whether a checkpoint is loadable is the
          # model's question: each model's score.sh and serve.sh refuse an incomplete one by name
          # before loading it.
          for root, skip in [(out, checkpoints)] + [(c, []) for c in checkpoints]:
              name = str(root.relative_to(out)) if root != out else "(final export)"
              found = files_under(root, skip)
              (root / "manifest.json").write_text(
                  json.dumps(
                      dict(
                          file_count=len(found),
                          total_bytes=sum(f["bytes"] for f in found),
                          files=found,
                      ),
                      indent=2,
                  )
                  + "\n"
              )
              print("manifest: %s — %d files, %d bytes"
                    % (name, len(found), sum(f["bytes"] for f in found)))

          if not checkpoints and not files_under(out, []):
              print("ERROR: the training stage published nothing at all", file=sys.stderr)
              sys.exit(1)
          PY

          # The task runs as root while the uploading sidecar does not, so anything written via
          # tempfile is mode 0600 and silently unreadable to it — logged as a per-file error, then
          # reported as uploaded.
          chmod -R a+rX {{output}}
          echo "published $(find {{output}} -type f | wc -l) files"

          # Fail only if nothing was published at all.
          if [ "${MANIFEST_RC}" -ne 0 ]; then
            echo "ERROR: published checkpoint is incomplete; see above" >&2
            exit "${MANIFEST_RC}"
          fi
{% endif %}

{% if run_eval | string | lower == 'true' %}
  # ==========================================================================
  # 3. EVAL — the stop/go gate. No robot involved.
  # ==========================================================================
  - name: eval
    tasks:
    - name: score-checkpoint
      lead: true
{% if hf_token_credential %}
      # A gated model needs this and the pipeline cannot know which; the model names the
      # credential in its model.vars. Keyed on the CAPABILITY, not on the model, so adding a
      # model still adds no branch.
      credentials:
        {{ hf_token_credential }}:
          HF_TOKEN: token
{% endif %}
      image: "{{ runtime_image }}"
      resource: gpu_infer
      inputs:
{% if run_train | string | lower == 'true' %}
      - task: train-model
{% else %}
      - url: "{{ checkpoint_url }}"
{% endif %}
{% if run_prepare | string | lower == 'true' %}
      - task: prepare-dataset
{% else %}
      - url: "{{ prepared_dataset_url }}"
{% endif %}
      - task: check-config
      outputs:
      - url: "{{ storage_url }}/eval/{{ model }}/{{workflow_id}}/"
      files:
      - localpath: models/{{ model }}/install.sh
        path: /tmp/install.sh
      - localpath: models/{{ model }}/score.sh
        path: /tmp/score.sh
      - localpath: models/{{ model }}/common.py
        path: /tmp/common.py
      - localpath: models/{{ model }}/score_lib.py
        path: /tmp/score_lib.py
      # Shared trajectory statistics, so a figure two models report under one name is one
      # implementation. Lands beside score_lib.py, which imports it.
      - localpath: ../so101-vla/files/trajectory_metrics.py
        path: /tmp/trajectory_metrics.py
      command: [bash, -c]
      args:
        - |
          set -euo pipefail
          source /tmp/install.sh eval
          mkdir -p {{output}}
          bash /tmp/score.sh "{{input:0}}" "{{input:1}}" "{{output}}" "{{ traj_ids }}" {{ execution_horizon }} {{ max_steps }}
          chmod -R a+rX {{output}}
          cat {{output}}/metrics.json
          # A gate has to exit non-zero, or the stage after it runs anyway. `complete` says the
          # requested sample was actually scored. The error figures are reported, never gated;
          # see README.md.
          python3 - {{output}}/metrics.json <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          bad = [k for k in ("complete",) if m.get(k) is False]
          if bad:
              sys.exit(f"GATE FAILED: {bad} — do not drive hardware with this checkpoint")
          print("gate passed")
          PY
{% endif %}

{% if run_hil | string | lower == 'true' %}
  # ==========================================================================
  # 4. HIL — THIS MOVES A ROBOT. One gang-scheduled group so the client cannot
  #    start without a server; the client is `lead` so a finished run tears the
  #    GPU task down instead of leaving it burning.
  # ==========================================================================
  - name: hil
    tasks:
    - name: policy-server
      image: "{{ runtime_image }}"
      resource: gpu_infer
{% if hf_token_credential %}
      # A gated model needs this and the pipeline cannot know which; the model names the
      # credential in its model.vars. Keyed on the CAPABILITY, not on the model, so adding a
      # model still adds no branch.
      credentials:
        {{ hf_token_credential }}:
          HF_TOKEN: token
{% endif %}
      inputs:
{% if run_train | string | lower == 'true' %}
      - task: train-model
{% else %}
      - url: "{{ checkpoint_url }}"
{% endif %}
{% if run_prepare | string | lower == 'true' %}
      - task: prepare-dataset
{% else %}
      - url: "{{ prepared_dataset_url }}"
{% endif %}
{% if run_eval | string | lower == 'true' %}
      # When scoring is in the same submission, the arm waits on it. Without this edge the
      # groups are unordered and a checkpoint whose scoring just failed could drive
      # the arm anyway — which silently demotes the stop/go gate both pipelines call mandatory.
      - task: score-checkpoint
{% endif %}
      - task: check-config
      files:
      - localpath: models/{{ model }}/install.sh
        path: /tmp/install.sh
      - localpath: models/{{ model }}/serve.sh
        path: /tmp/serve.sh
      - localpath: models/{{ model }}/common.py
        path: /tmp/common.py
      - localpath: models/{{ model }}/serve_lib.py
        path: /tmp/serve_lib.py
      # The transport, injected into both ends of this group so the server and client cannot
      # disagree about the wire. May be empty: a model whose transport is an installable package
      # provides it from client_transport.sh instead.
      - localpath: models/{{ model }}/transport.py
        path: /tmp/transport.py
      command: [bash, -c]
      args:
        - |
          set -euo pipefail
          source /tmp/install.sh serve
          # -u so a traceback is not lost when the lead client's exit tears this down.
          # Camera NAMES only. This node has no cameras attached, so a device path here would
          # be meaningless; the server needs the names solely to refuse a rig the checkpoint
          # was not trained on.
          # ';' between cameras, ',' between the NAMES on the way out — the server's flag takes a
          # comma-separated list. Getting this separator wrong extracts one name from the whole
          # string, and the server then refuses the rig.
          CAMERA_NAMES="$(echo "{{ cameras }}" | tr ';' '\n' | cut -d= -f1 | paste -sd, -)"
          echo "camera names for the server: ${CAMERA_NAMES}"
          bash /tmp/serve.sh "{{input:0}}" "{{input:1}}" {{ policy_port }} "${CAMERA_NAMES}"

    - name: robot-client
      lead: true
      image: "{{ client_image }}"
      resource: robot
      # Character devices fail to open without it, while looking present and correctly owned.
      # It also gives the container the host's whole /dev, which is what lets a camera selector
      # resolve on the node. No camera volumeMounts are declared; a selector is not known at
      # submit time, so none would help.
      privileged: true
      volumeMounts:
        - "{{ robot_port }}"
      outputs:
      - url: "{{ storage_url }}/hil/{{ model }}/{{workflow_id}}/"
      files:
      # The robot client is shared and model-independent, and is not selected by the model
      # variable. There is exactly one copy of it in the repo.
      - localpath: ../so101-vla/files/eval_so101_bounded.py
        path: /tmp/eval_so101_bounded.py
      # The transport IS the model's choice, so it comes from the model directory.
      - localpath: models/{{ model }}/client_transport.sh
        path: /tmp/client_transport.sh
      # The same transport file the server got. See the note on the server task.
      - localpath: models/{{ model }}/transport.py
        path: /tmp/transport.py
{% if calibration_localpath %}
      - localpath: {{ calibration_localpath }}
        path: /tmp/calibration/{{ robot_id }}.json
{% endif %}
      command: [bash, -c]
      args:
        - |
          set -euo pipefail

          # CPU wheels: lerobot imports torch transitively so it cannot be skipped, and the CUDA
          # build is ~2.5 GB of no use on a machine with no GPU.
          pip install --quiet --root-user-action=ignore \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch=={{ torch_version }}" "torchvision=={{ torchvision_version }}"

          # A tarball, because this image has no git. One resolve rather than several: installed
          # separately, these packages downgrade each other's huggingface-hub.
          pip install --quiet --root-user-action=ignore \
            "lerobot[feetech] @ https://github.com/huggingface/lerobot/archive/{{ lerobot_commit }}.tar.gz" \
            "pyzmq=={{ pyzmq_version }}" \
            "msgpack=={{ msgpack_version }}" \
            "msgpack-numpy=={{ msgpack_numpy_version }}"

          # Whatever transport this model's server speaks, plus TRANSPORT_MODULE. Sourced.
          # PYTHONPATH so a transport supplied as the slot file resolves; a model whose transport
          # is an installed package does not need it and is unaffected.
          export PYTHONPATH="/tmp${PYTHONPATH:+:${PYTHONPATH}}"
          source /tmp/client_transport.sh

          # Conditional flags go into arrays, never into the command's own backslash
          # continuation: a block rendering to nothing leaves a blank line, which would end the
          # command early and drop every argument after it.
          EXTRA=()
{% if calibration_localpath %}
          EXTRA+=(--calibration-dir /tmp/calibration)
{% endif %}
{% if home_pose %}
          EXTRA+=(--home-pose "{{ home_pose }}" --home-ramp-s {{ home_ramp_s }})
{% endif %}
          # --no-motion is a store_true flag: present or absent, never given a value.
{% if allow_motion | string | lower != 'true' %}
          EXTRA+=(--no-motion)
{% endif %}
          echo "extra arguments: ${EXTRA[*]-none}"

          CAMERAS=()
{% for cam in cameras.split(';') %}
          CAMERAS+=(--camera "{{ cam }}")
{% endfor %}
          echo "cameras: ${CAMERAS[*]}"

          python /tmp/eval_so101_bounded.py \
            --transport-module "${TRANSPORT_MODULE}" \
            --policy-host {{host:policy-server}} \
            --policy-port {{ policy_port }} \
            --policy-timeout-ms {{ policy_timeout_ms }} \
            --policy-setup-timeout-s {{ policy_setup_timeout_s }} \
            --policy-wait-s {{ policy_wait_s }} \
            --policy-retries {{ policy_retries }} \
            --robot-port {{ robot_port }} \
            --robot-id {{ robot_id }} \
            "${CAMERAS[@]}" \
            --camera-width {{ camera_width }} \
            --camera-height {{ camera_height }} \
            --camera-fps {{ camera_fps }} \
            --joint-margin-deg {{ joint_margin_deg }} \
            --gripper-margin {{ gripper_margin }} \
            --max-step-deg {{ max_step_deg }} \
            --max-step-gripper {{ max_step_gripper }} \
            --acceleration {{ acceleration }} \
            --speed {{ speed }} \
            --command-deadband-deg {{ command_deadband_deg }} \
            --command-deadband-gripper {{ command_deadband_gripper }} \
            --max-servo-temp-c {{ max_servo_temp_c }} \
            --temp-confirm-reads {{ temp_confirm_reads }} \
            --resume-servo-temp-c {{ resume_servo_temp_c }} \
            --cooldown-timeout-s {{ cooldown_timeout_s }} \
            --max-cooldowns {{ max_cooldowns }} \
            --release-settle-s {{ release_settle_s }} \
            --release-ramp-s {{ release_ramp_s }} \
            "${EXTRA[@]}" \
            --action-horizon {{ action_horizon }} \
            --control-hz {{ control_hz }} \
            --run-duration-s {{ run_duration_s }} \
            --interval-s {{ interval_s }} \
            --lang-instruction "{{ lang_instruction }}" \
            --output-dir {{output}} 2>&1 | tee {{output}}/hil_eval.log

          # lineage.json records what produced this result: the source URLs, the model, and the
          # stages that ran. It sits beside the client's results.json, which records what the
          # client resolved. Written after the client, so an aborted run still gets one.
          python3 - {{output}}/lineage.json <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          record = {
              "workflow_id": "{{workflow_id}}",
              "model": "{{ model }}",
              # A chained checkpoint has no URL; its input is <workflow-id>/<task-name>/.
{% if run_train | string | lower == 'true' %}
              "checkpoint_source": {"kind": "task", "task": "train-model", "workflow_id": "{{workflow_id}}"},
{% else %}
              "checkpoint_source": {"kind": "url", "url": "{{ checkpoint_url }}"},
{% endif %}
{% if run_prepare | string | lower == 'true' %}
              "dataset_source": {"kind": "task", "task": "prepare-dataset", "workflow_id": "{{workflow_id}}"},
{% else %}
              "dataset_source": {"kind": "url", "url": "{{ prepared_dataset_url }}"},
{% endif %}
              "cameras_requested": "{{ cameras }}",
              "robot_port": "{{ robot_port }}",
              "robot_id": "{{ robot_id }}",
              # A real JSON boolean. The raw value's case depends on how it was passed, and the
              # Python-cased spelling is a truthy string.
              "allow_motion": "{{ allow_motion }}".strip().lower() == "true",
              "lang_instruction": "{{ lang_instruction }}",
              "action_horizon": {{ action_horizon }},
              "control_hz": {{ control_hz }},
              "run_duration_s": {{ run_duration_s }},
              "interval_s": {{ interval_s }},
              "stages_enabled": {
                  name: value.strip().lower() == "true"
                  for name, value in (
                      ("prepare", "{{ run_prepare }}"), ("train", "{{ run_train }}"),
                      ("eval", "{{ run_eval }}"), ("hil", "{{ run_hil }}"),
                  )
              },
              # Lifted from the client's own output so one file answers the whole question.
              "resolved": {},
          }
          results = out.parent / "results.json"
          if results.is_file():
              try:
                  r = json.loads(results.read_text())
                  record["resolved"] = {
                      "cameras": r.get("cameras"),
                      "torque_released": r.get("summary", {}).get("torque_released", r.get("torque_released")),
                      "no_motion": r.get("summary", {}).get("no_motion", r.get("no_motion")),
                  }
              except ValueError as exc:
                  record["resolved"] = {"error": f"results.json unreadable: {exc!r}"}
          else:
              record["resolved"] = {"error": "results.json absent — the client published nothing"}
          out.write_text(json.dumps(record, indent=2) + "\n")
          print("lineage:", json.dumps(record["resolved"]))
          PY

          chmod -R a+rX {{output}}
{% endif %}
  timeout:
    exec_timeout: "{{ exec_timeout }}"
