version: 2
# Stage 01 — port a LeRobot v2.1 dataset to v3.0, which is the only format LeRobot's own
# training code reads.
#
# This exists because the two model stacks want opposite things and neither reads the
# other's tree. GR00T needs v2 plus a `meta/modality.json`; LeRobot's `CODEBASE_VERSION` is
# v3.0 and it raises BackwardCompatibilityError on anything older. So a dataset prepared for
# one is unusable by the other, and this stage is the bridge in one direction.
#
# It deliberately does NOT acquire or validate a dataset — `so101-vla/01_prepare_dataset.yaml`
# does that, and this consumes what that published. The only job here is format.
#
# Flow:
#   read codebase_version  ->  already v3.0? publish unchanged and stop
#   ->  backfill meta/episodes_stats.jsonl  ->  run LeRobot's v3 converter
#   ->  assert episode and frame counts survived  ->  publish
default-values:
  # A prepared v2.1 tree, normally `<storage>/dataset/<name>/` from the other pipeline's
  # stage 01. Read-only: the conversion copies before it touches anything.
  dataset_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-vla/dataset/REPLACE-WITH-A-DATASET-NAME/
  storage_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast
  # Where the v3 tree lands, under `<storage_url>/dataset/<name>/`. MUST differ from the
  # input's name. A dataset prefix is named only by this value — no model, no format — so
  # reusing the input's name would overwrite the v2.1 tree the GR00T pipeline depends on.
  # The guard below refuses the placeholder for exactly that reason.
  dataset_out_name: REPLACE-WITH-A-NEW-NAME-NOT-THE-INPUT-ONE
  # Required by the converter's CLI, used only for naming. Nothing is pushed to the Hub.
  repo_id: local/so101-pi0fast

  platform: l40s
  # No GPU: this is parquet and video-container work. Requesting one would hold the pool's
  # only accelerator for the length of a conversion.
  cpu: 4
  memory: 48Gi
  # The converter builds a second tree beside the first and leaves the original at
  # <root>_old, so disk peaks at roughly three times the dataset.
  storage: 250Gi
  exec_timeout: 2h

workflow:
  name: so101-pi0fast-port-dataset
  resources:
    port:
      platform: "{{ platform }}"
      cpu: {{ cpu }}
      memory: {{ memory }}
      storage: {{ storage }}

  tasks:
  - name: port
    image: nvcr.io/nvidia/pytorch:25.04-py3
    resource: port
    inputs:
    - url: "{{ dataset_url }}"
    outputs:
    - url: "{{ storage_url }}/dataset/{{ dataset_out_name }}/"
    files:
    - localpath: files/pi0fast/install_pi0fast.sh
      path: /tmp/install_pi0fast.sh
    - localpath: files/pi0fast/backfill_episodes_stats.py
      path: /tmp/backfill_episodes_stats.py
    command: [bash, -c]
    args:
      - |
        set -euo pipefail

        # OSMO does not validate s3 URLs at submit time, so without this a forgotten --set
        # fails at upload, after the whole conversion.
        case "{{ storage_url }}{{ dataset_url }}" in
          *REPLACE-WITH-*)
            echo "ERROR: pass --set storage_url=s3://<bucket>/so101-pi0fast dataset_url=<a v2.1 tree>" >&2
            exit 2 ;;
        esac
        case "{{ dataset_out_name }}" in
          *REPLACE-WITH-*)
            echo "ERROR: pass --set dataset_out_name=<a name no other pipeline uses>" >&2
            echo "       A dataset prefix is named only by this value, so reusing an existing" >&2
            echo "       name overwrites that tree." >&2
            exit 2 ;;
        esac

        apt-get update -qq && apt-get install -y -qq curl ffmpeg
        curl -fsSL https://astral.sh/uv/install.sh | sh
        export PATH="${HOME}/.local/bin:${PATH}"
        source /tmp/install_pi0fast.sh

        # Find the root by the file that must exist rather than assuming nesting depth:
        # OSMO's download layout depends on the input URL's shape.
        INFO="$(find {{input:0}} -name info.json -path '*/meta/*' -print -quit)"
        if [ -z "${INFO}" ]; then
          echo "ERROR: no meta/info.json under {{input:0}} — is {{ dataset_url }} a dataset prefix?" >&2
          find {{input:0}} -maxdepth 3 >&2
          exit 1
        fi
        SRC="$(dirname "$(dirname "${INFO}")")"
        SRC_VERSION="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['codebase_version'])" "${SRC}/meta/info.json")"
        echo "source: ${SRC} (codebase_version=${SRC_VERSION})"

        DS=/tmp/dataset_out
        rm -rf "${DS}"; mkdir -p "${DS}"
        cp -a "${SRC}/." "${DS}/"

        if [ "${SRC_VERSION}" = "v3.0" ]; then
          echo "already v3.0 — publishing unchanged"
        else
          # Datasets written by GR00T-flavoured tooling declare v2.1 but carry the v2.0
          # metadata layout: no meta/episodes_stats.jsonl. LeRobot's converter validates the
          # version string, believes it, and dies on the missing file. The v2.0 -> v2.1
          # script that used to write it was removed in v0.6.x, hence the backfill.
          python /tmp/backfill_episodes_stats.py "${DS}"

          # --root is the exact folder holding meta/, data/, videos/. The converter builds
          # <root>_v30, moves it over <root> and leaves the original at <root>_old, so after
          # this ${DS} is the v3 tree. --push-to-hub=false keeps it local.
          python "${LEROBOT_DIR}/src/lerobot/scripts/convert_dataset_v21_to_v30.py" \
            --repo-id="{{ repo_id }}" \
            --root="${DS}" \
            --push-to-hub=false

          # Frame count is what catches a partial conversion; a version bump alone would not.
          python3 - "${SRC}/meta/info.json" "${DS}/meta/info.json" <<'PY'
        import json, sys
        before, after = (json.load(open(p)) for p in sys.argv[1:3])
        print(f"converted: codebase_version={after['codebase_version']} "
              f"episodes={after.get('total_episodes')} frames={after.get('total_frames')}")
        if not str(after["codebase_version"]).startswith("v3"):
            sys.exit(f"ERROR: conversion left codebase_version={after['codebase_version']}")
        for key in ("total_episodes", "total_frames"):
            if before.get(key) != after.get(key):
                sys.exit(f"ERROR: {key} changed in conversion: {before.get(key)} -> {after.get(key)}")
        print("episode and frame counts preserved")
        PY
        fi

        cp -a "${DS}/." "{{output}}/"

        # The uploader logs per-file failures and then reports success anyway, and this task
        # cannot check its own upload — the uploader runs after the container exits. So the
        # manifest travels with the dataset, and a later stage can tell a complete tree from
        # a truncated one.
        python3 - "{{output}}" <<'PY'
        import hashlib, json, pathlib, sys
        root = pathlib.Path(sys.argv[1])
        files = {}
        for path in sorted(root.rglob("*")):
            if path.is_file() and path.name != "manifest.json":
                files[str(path.relative_to(root))] = path.stat().st_size
        (root / "manifest.json").write_text(json.dumps({"files": files}, indent=2) + "\n")
        print(f"manifest.json: {len(files)} files, {sum(files.values())} bytes")
        PY

        chmod -R a+rX "{{output}}"
        echo "files to upload: $(find "{{output}}" -type f | wc -l)"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
