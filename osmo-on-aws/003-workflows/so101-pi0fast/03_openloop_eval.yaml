version: 2
# Stage 03 — score a checkpoint against ground truth, on a GPU, with no robot involved.
#
# This is the stop/go gate, and it is the point of the exercise. An under-trained policy, a
# wrong joint order and missing normalisation statistics all look identical on real
# hardware — an arm that moves wrongly — and this separates them for a few GPU-minutes.
# Treat it as a gate, not an optional extra.
#
# Two families of number, because they answer different questions:
#   MSE / MAE, overall and per dimension  ->  is it roughly right?
#   direction-reversal rate               ->  is it smooth?
# The second is not redundant. A zero-mean oscillation on a broadly correct trajectory
# scores well on MSE and cooks the smallest servo. The GR00T pipeline learned that from a
# hardware run that aborted on gripper temperature while its MSE gate was satisfied.
#
# The reversal metric is the same definition the GR00T pipeline uses, deliberately, so the
# two models' numbers are comparable — which is the whole reason for running a second model.
default-values:
  # One `checkpoint-<step>/pretrained_model/` directory from stage 02. Naming a whole run
  # prefix works but downloads every checkpoint it retained, at ~22 GB each.
  checkpoint_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast/checkpoints/pi0fast/REPLACE-WITH-A-RUN-ID/train_out/checkpoints/REPLACE-WITH-A-STEP/pretrained_model/
  # The v3.0 tree stage 02 trained on.
  dataset_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast/dataset/REPLACE-WITH-A-DATASET-NAME/
  storage_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast
  repo_id: local/so101-pi0fast

  # --- what to score ----------------------------------------------------------
  # Several trajectories: one lucky trajectory is not convergence. Out-of-range IDs are
  # skipped with a warning and reported as `complete: false`, and the task then exits
  # non-zero — a typo must not quietly shrink the sample being averaged.
  traj_ids: "0 1 2"
  # Frames per trajectory. 400 at 30 fps is ~13 s of a recording.
  max_steps: 400
  # Actions consumed per chunk before re-planning. Must match what the robot will execute,
  # or this scores a trajectory nobody runs. pi0-FAST predicts 50; 16 matches what the GR00T
  # pipeline executes, which keeps the two comparable. Measured inference is 160 ms against
  # 533 ms of motion at 16 actions and 30 Hz, so the choice is about control quality here
  # rather than about hiding latency.
  execution_horizon: 16
  # Warn above this worst-joint reversal fraction. Teleop recordings of this task sit under
  # 1%; a random walk scores 50% and uncorrelated noise 67%.
  warn_reversals: 0.25

  # --- the machine ------------------------------------------------------------
  platform: l40s
  gpu: 1
  cpu: 4
  memory: 48Gi
  # A 7.2 GB model plus the dataset. No optimizer state: inference does not need it, which
  # is why checkpoint_url points at pretrained_model/ rather than the checkpoint root.
  storage: 80Gi
  exec_timeout: 2h

workflow:
  name: so101-pi0fast-openloop-eval
  resources:
    eval:
      platform: "{{ platform }}"
      gpu: {{ gpu }}
      cpu: {{ cpu }}
      memory: {{ memory }}
      storage: {{ storage }}

  tasks:
  - name: openloop-eval
    image: nvcr.io/nvidia/pytorch:25.04-py3
    resource: eval
    credentials:
      huggingface_token:
        HF_TOKEN: token
    inputs:
    - url: "{{ checkpoint_url }}"
    - url: "{{ dataset_url }}"
    outputs:
    - url: "{{ storage_url }}/openloop/{{workflow_id}}/"
    files:
    - localpath: files/pi0fast/install_pi0fast.sh
      path: /tmp/install_pi0fast.sh
    - localpath: files/pi0fast/open_loop_eval.py
      path: /tmp/open_loop_eval.py
    command: [bash, -c]
    args:
      - |
        set -euo pipefail

        case "{{ storage_url }}{{ checkpoint_url }}{{ dataset_url }}" in
          *REPLACE-WITH-*)
            echo "ERROR: pass --set storage_url=... checkpoint_url=... dataset_url=..." >&2
            exit 2 ;;
        esac

        nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
        # ffmpeg is for torchcodec: without libav* its shared library fails to load and
        # LeRobot warns and silently falls back to pyav — scoring on a different decode path
        # than training used would make the comparison meaningless.
        apt-get update -qq && apt-get install -y -qq curl ffmpeg

        # The tokenizer repo is gated and is fetched during model construction, so a 403
        # otherwise arrives minutes in, three exception layers below a RuntimeError.
        for repo in google/paligemma-3b-pt-224 lerobot/fast-action-tokenizer; do
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/models/${repo}")"
          echo "HF ${repo}: ${code}"
          if [ "${code}" != "200" ]; then
            echo "ERROR: cannot read ${repo} (HTTP ${code}); accept its terms as the token's account" >&2
            exit 2
          fi
        done

        curl -fsSL https://astral.sh/uv/install.sh | sh
        export PATH="${HOME}/.local/bin:${PATH}"
        source /tmp/install_pi0fast.sh
        # matplotlib is not a LeRobot dependency and only the plots need it. Installed into
        # the same venv, after the single resolve, because it constrains nothing.
        uv pip install "matplotlib>=3.10,<4"

        CKPT="$(dirname "$(find {{input:0}} -name config.json -print -quit)")"
        if [ -z "${CKPT}" ]; then
          echo "ERROR: no config.json under {{input:0}} — is {{ checkpoint_url }} a pretrained_model/ prefix?" >&2
          find {{input:0}} -maxdepth 4 >&2
          exit 1
        fi
        INFO="$(find {{input:1}} -name info.json -path '*/meta/*' -print -quit)"
        if [ -z "${INFO}" ]; then
          echo "ERROR: no meta/info.json under {{input:1}} — is {{ dataset_url }} a dataset prefix?" >&2
          exit 1
        fi
        DS="$(dirname "$(dirname "${INFO}")")"
        DS_VERSION="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['codebase_version'])" "${INFO}")"
        echo "checkpoint: ${CKPT}"
        echo "dataset:    ${DS} (codebase_version=${DS_VERSION})"
        case "${DS_VERSION}" in
          v3*) ;;
          *)   echo "ERROR: LeRobot reads v3.0 only, found ${DS_VERSION}. Run 01_port_dataset.yaml first." >&2
               exit 1 ;;
        esac

        # The script writes metrics.json itself rather than printing numbers a caller has to
        # scrape back out of this log. Its exit code is the gate: non-zero means a requested
        # trajectory was never scored.
        set +e
        python -u /tmp/open_loop_eval.py \
          --checkpoint "${CKPT}" \
          --dataset-root "${DS}" \
          --repo-id "{{ repo_id }}" \
          --traj-ids "{{ traj_ids }}" \
          --execution-horizon {{ execution_horizon }} \
          --max-steps {{ max_steps }} \
          --warn-reversals {{ warn_reversals }} \
          --output-dir "{{output}}" \
          2>&1 | tee "{{output}}/openloop_eval.log"
        EVAL_RC=${PIPESTATUS[0]}
        set -e
        echo "open_loop_eval exit code: ${EVAL_RC}"

        # chmod must run even on failure, or the uploader cannot read the log that explains
        # it. Capturing the exit code rather than letting `set -e` act is what makes that
        # possible.
        chmod -R a+rX "{{output}}"
        echo "files to upload: $(find "{{output}}" -type f | wc -l)"
        exit "${EVAL_RC}"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
