version: 2
# Stage 02 — fine-tune pi0-FAST on an SO-101 dataset, on one GPU, through `lerobot-train`.
#
# Takes a **v3.0** tree. Stage 01 makes one. Given a v2.1 tree this fails immediately with a
# message naming stage 01, rather than dying deep inside LeRobot's dataset loader.
#
# pi0-FAST is autoregressive over discretized action tokens, where GR00T N1.7 denoises with a
# flow-matching head. That is the whole point of having both: if this pipeline works, the
# stages are not shaped around one model's architecture.
#
# Measured on one L40S (44.39 GiB usable) with two 480x640 cameras and 6 action dims:
#
#   batch 1  36.02 GB  0.465 s/step      batch 4  39.71 GB  0.746 s/step   <- default
#   batch 2  36.05 GB  0.558 s/step      batch 6  OOM
#
# There is no LoRA path: LeRobot's pi0_fast is full fine-tune only, so ~15 GB of optimizer
# state is unavoidable and is what caps the batch at 4.
default-values:
  # A v3.0 tree from stage 01.
  dataset_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast/dataset/REPLACE-WITH-A-DATASET-NAME/
  storage_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast
  # Required by lerobot-train, used only to name the dataset locally. Nothing is pushed.
  repo_id: local/so101-pi0fast

  # --- training ---------------------------------------------------------------
  # 4 is the measured ceiling on a 48 GB card, not a preference. 6 OOMs asking for 182 MiB
  # with 9 MiB free, so `PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True` or
  # gradient_checkpointing may buy one more step; neither is tested.
  batch_size: 4
  # Upstream defaults this to float32, which roughly doubles memory on a 2.6B model. Set
  # explicitly: inheriting it silently is how a run OOMs for no reason.
  dtype: bfloat16
  # Not needed at batch 4. This is the lever to try for batch >= 6.
  gradient_checkpointing: false
  # ~4.3 epochs of a 43-episode, 18,744-frame dataset at batch 4, about 4.2 h. An epoch is
  # 4,686 steps here. For reference, matching the ~17 epochs a comparable GR00T run covered
  # would be ~80,000 steps and ~16 h — raise this deliberately, and raise exec_timeout with
  # it. Do not budget exec_timeout from a short run's step rate: start-up dominates and a
  # brief run reports roughly twice the throughput a sustained one achieves.
  steps: 20000
  save_freq: 5000
  log_freq: 100
  seed: 1000

  # --- the machine ------------------------------------------------------------
  platform: l40s
  gpu: 1
  # The node reports 7 usable vCPU and 60 Gi, and the osmo-ctrl sidecar takes a fixed 1 CPU
  # on top of whatever a task requests.
  cpu: 4
  memory: 48Gi
  # Dataset plus a 7.2 GB model and 15 GB of optimizer state per saved checkpoint. Storage is
  # a *scheduled* resource: under-request it and kubelet evicts the pod mid-run.
  storage: 250Gi
  exec_timeout: 8h

workflow:
  name: so101-pi0fast-finetune
  resources:
    train:
      platform: "{{ platform }}"
      gpu: {{ gpu }}
      cpu: {{ cpu }}
      memory: {{ memory }}
      storage: {{ storage }}

  tasks:
  - name: finetune
    image: nvcr.io/nvidia/pytorch:25.04-py3
    resource: train
    credentials:
      # pi0-FAST's text tokenizer is google/paligemma-3b-pt-224, a GATED repo. The token's
      # account must have accepted its terms.
      huggingface_token:
        HF_TOKEN: token
    inputs:
    - url: "{{ dataset_url }}"
    # Per-run prefix, so two experiments cannot overwrite each other and later stages can pin
    # an exact run.
    outputs:
    - url: "{{ storage_url }}/checkpoints/pi0fast/{{workflow_id}}/"
    files:
    - localpath: files/pi0fast/install_pi0fast.sh
      path: /tmp/install_pi0fast.sh
    command: [bash, -c]
    args:
      - |
        set -euo pipefail

        case "{{ storage_url }}{{ dataset_url }}" in
          *REPLACE-WITH-*)
            echo "ERROR: pass --set storage_url=s3://<bucket>/so101-pi0fast dataset_url=<a v3.0 tree>" >&2
            exit 2 ;;
        esac

        nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
        # ffmpeg is for torchcodec, not for us: libtorchcodec_core*.so links against libav*,
        # and without them LeRobot warns and silently falls back to pyav — training on a
        # different decode path than evaluation would use.
        apt-get update -qq && apt-get install -y -qq curl ffmpeg

        # Preflight the gated repos before spending anything. The tokenizer is fetched during
        # model construction, so a 403 otherwise surfaces minutes in, three exception layers
        # below a RuntimeError about tokenizers.
        for repo in google/paligemma-3b-pt-224 lerobot/fast-action-tokenizer; do
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/models/${repo}")"
          echo "HF ${repo}: ${code}"
          if [ "${code}" != "200" ]; then
            echo "ERROR: cannot read ${repo} (HTTP ${code})." >&2
            echo "       403 means the token's account has not accepted that repo's terms:" >&2
            echo "       sign in as that account at https://huggingface.co/${repo} and accept." >&2
            exit 2
          fi
        done

        curl -fsSL https://astral.sh/uv/install.sh | sh
        export PATH="${HOME}/.local/bin:${PATH}"
        source /tmp/install_pi0fast.sh

        INFO="$(find {{input:0}} -name info.json -path '*/meta/*' -print -quit)"
        if [ -z "${INFO}" ]; then
          echo "ERROR: no meta/info.json under {{input:0}} — is {{ dataset_url }} a dataset prefix?" >&2
          find {{input:0}} -maxdepth 3 >&2
          exit 1
        fi
        DS="$(dirname "$(dirname "${INFO}")")"
        DS_VERSION="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['codebase_version'])" "${INFO}")"
        echo "dataset root: ${DS} (codebase_version=${DS_VERSION})"
        case "${DS_VERSION}" in
          v3*) ;;
          *)   echo "ERROR: LeRobot reads v3.0 only, found ${DS_VERSION}." >&2
               echo "       Run 01_port_dataset.yaml on this tree first." >&2
               exit 1 ;;
        esac

        # NOT mkdir'd: lerobot-train's own validate() raises FileExistsError if the output
        # directory already exists and resume is false.
        rm -rf /tmp/train_out

        # `--dataset.root` points at a local tree, so nothing is pulled from the Hub for the
        # DATASET. Model weights still are, which is what HF_TOKEN is for.
        # `--policy.push_to_hub=false` is mandatory: it defaults to true, and validate() then
        # demands a repo_id, which reads as a dataset error and is not one.
        set +e
        lerobot-train \
          --dataset.repo_id="{{ repo_id }}" \
          --dataset.root="${DS}" \
          --policy.type=pi0_fast \
          --policy.dtype={{ dtype }} \
          --policy.gradient_checkpointing={{ gradient_checkpointing }} \
          --policy.device=cuda \
          --policy.push_to_hub=false \
          --batch_size={{ batch_size }} \
          --steps={{ steps }} \
          --save_freq={{ save_freq }} \
          --log_freq={{ log_freq }} \
          --seed={{ seed }} \
          --output_dir=/tmp/train_out \
          2>&1 | tee "{{output}}/train.log"
        TRAIN_RC=${PIPESTATUS[0]}
        set -e
        echo "lerobot-train exit code: ${TRAIN_RC}"

        # Published whether or not training succeeded: peak memory next to an OOM traceback is
        # the answer to "what does this need", not a failed run to retry blindly. The exit
        # code is captured rather than allowed to kill the script for the same reason — with
        # `set -e` and a pipe, a non-zero exit would skip the chmod below and the uploader
        # could not read the log explaining the failure.
        python3 - "{{output}}" "${TRAIN_RC}" <<'PY'
        import json, pathlib, re, sys
        out = pathlib.Path(sys.argv[1])
        log = (out / "train.log").read_text(errors="replace")
        def last(pattern):
            found = re.findall(pattern, log)
            return found[-1] if found else None
        mems = [float(m) for m in re.findall(r"mem_gb:([0-9.]+)", log)]
        metrics = {
            # Passed in rather than inferred: a metrics file that cannot say whether the run
            # succeeded is worse than no metrics file.
            "train_exit_code": int(sys.argv[2]),
            "peak_vram_gb": max(mems) if mems else None,
            "final_loss": last(r"loss:([0-9.]+)"),
            "step_s": last(r"updt_s:([0-9.]+)"),
            "data_s": last(r"data_s:([0-9.]+)"),
            "steps_logged": last(r"step:([0-9]+)"),
        }
        (out / "metrics.json").write_text(json.dumps(metrics, indent=2) + "\n")
        print(json.dumps(metrics, indent=2))
        PY

        if [ -d /tmp/train_out ]; then
          cp -a /tmp/train_out "{{output}}/train_out"
          # The uploader logs per-file failures and then reports success anyway, and this task
          # cannot check its own upload — the uploader runs after the container exits.
          python3 - "{{output}}" <<'PY'
        import json, pathlib, sys
        root = pathlib.Path(sys.argv[1])
        files = {
            str(p.relative_to(root)): p.stat().st_size
            for p in sorted(root.rglob("*"))
            if p.is_file() and p.name != "manifest.json"
        }
        (root / "manifest.json").write_text(json.dumps({"files": files}, indent=2) + "\n")
        print(f"manifest.json: {len(files)} files, {sum(files.values())} bytes")
        PY
        fi

        chmod -R a+rX "{{output}}"
        echo "files to upload: $(find "{{output}}" -type f | wc -l)"
        exit "${TRAIN_RC}"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
