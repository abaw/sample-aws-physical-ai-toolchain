version: 2
# Stage 04 — close the loop: pi0-FAST on a cloud GPU, driving a physical SO-101 arm attached
# to an on-premise machine that joined the cluster as a hybrid node.
#
# THIS STAGE MOVES A ROBOT. Read the README's safety section, run it once with
# `no_motion=true`, and be next to the arm with a hand on its power the first powered time.
#
# One gang-scheduled group of two tasks. The policy server holds the GPU; the robot client
# holds the arm and is `lead: true`, so when the eval finishes the group ends and the GPU task
# is torn down with it rather than left burning.
#
# The robot client is `so101-vla/files/eval_so101_bounded.py`, **reused unchanged**. Its
# hardware safety was earned on this arm and a second copy of it could drift; instead it is
# pointed at this pipeline's transport with `--transport-module`. The observation and action
# contract on the wire is therefore the same one that client already speaks, and adapting it
# to LeRobot's batch format is the server's job. That split is deliberate: the contract is the
# pipeline's interface, and each model's server meets it.
#
# Serving is written here because nothing shipped can serve this checkpoint — openpi's
# websocket server loads openpi's own checkpoint layout, and LeRobot's async policy server
# lists the policies it supports and `pi0_fast` is not among them.
default-values:
  # --- what to run ------------------------------------------------------------
  # ONE checkpoint's pretrained_model/ directory from stage 02. Inference needs no optimizer
  # state, so pointing at the checkpoint root would transfer ~15 GB for nothing.
  checkpoint_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast/checkpoints/pi0fast/REPLACE-WITH-A-RUN-ID/train_out/checkpoints/REPLACE-WITH-A-STEP/pretrained_model/
  # The v3.0 tree stage 02 trained on. Loaded for its normalisation statistics, not its
  # frames: a policy served with different statistics than it trained on drives confidently
  # to the wrong pose.
  dataset_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast/dataset/REPLACE-WITH-A-DATASET-NAME/
  storage_url: s3://REPLACE-WITH-YOUR-DATASETS-BUCKET/so101-pi0fast
  repo_id: local/so101-pi0fast
  # The text your dataset was annotated with. The policy is conditioned on it.
  lang_instruction: REPLACE-WITH-YOUR-TASK-DESCRIPTION

  # --- safety -----------------------------------------------------------------
  # Rehearsal mode: everything runs — both tasks schedule, the client resolves the server's
  # host, the observation passes the server, chunk length is checked, real end-to-end latency
  # is measured, every requested action is logged and range-checked — while performing ZERO
  # writes to the servo bus. Run this first. Every write path is gated behind this flag.
  #
  # It defaults to TRUE, so the arm cannot move unless you say so. To move it you must pass
  # `no_motion=false` explicitly — omitting the flag leaves it on, and a run that looks
  # correct in every other respect will simply not move. Check `summary.no_motion` in
  # results.json before concluding the arm is broken.
  no_motion: true
  # TEST ONLY, and off by default. Adds uniform noise of this magnitude to every action in
  # the SERVER, so a checkpoint that has not learned to move still makes the arm move and its
  # tracking can be checked. Refused above 5 deg by the server, before it opens its socket.
  # It lives server-side so no motion-generating code enters the safety-critical client, and
  # so the client's envelope clamp and per-step delta limit bound it exactly as they bound a
  # real policy's output. Any trace from a jittered run is NOT the policy's output.
  jitter_deg: 0

  # --- the control loop -------------------------------------------------------
  # Measured: local inference is ~160 ms p50 and pi0-FAST predicts 50 actions, so 16 executed
  # actions buy 533 ms of motion against a round trip of roughly 450 ms. That leaves the
  # choice of horizon to control quality rather than to hiding latency — executing all 50
  # would mean 1.67 s open-loop between re-plans, unable to react to a moved object. 16 also
  # matches what the GR00T pipeline executes, which keeps the two comparable.
  action_horizon: 16
  control_hz: 30
  # Total evaluation time, counting the home ramp at the start of every interval.
  run_duration_s: 20
  interval_s: 60
  # Six values in joint order, ramped to at the start of each interval. Without it each
  # interval starts wherever the last left the arm and the policy extrapolates from a pose it
  # never trained on.
  home_pose: ""
  home_ramp_s: 4

  # Per-joint clamps, applied to every commanded value.
  joint_margin_deg: 5
  gripper_margin: 3
  max_step_deg: 6
  max_step_gripper: 8
  acceleration: 20
  speed: 600
  command_deadband_deg: 0
  command_deadband_gripper: 0

  # At this temperature the run rests rather than stopping: the arm returns, torque comes off
  # (it cannot cool while holding a pose), and driving resumes once cool. Budget exec_timeout
  # for the rests.
  max_servo_temp_c: 55
  temp_confirm_reads: 3
  resume_servo_temp_c: 45
  cooldown_timeout_s: 600
  max_cooldowns: 20
  release_ramp_s: 2
  release_settle_s: 6

  # Set the receive timeout above your own round-trip p99 or the run aborts on healthy jitter.
  # Its real purpose is the arithmetic: the arm can hold a stale pose for at most
  # (policy_retries + 1) x policy_timeout_ms.
  policy_timeout_ms: 1500
  policy_retries: 1
  policy_setup_timeout_s: 120
  # The group is gang-scheduled, so the client starts when the server does — and the server
  # has a 7.2 GB checkpoint to fetch and a model to load first.
  policy_wait_s: 1800
  policy_port: 5555

  # --- the machines -----------------------------------------------------------
  # A platform selects nodes through its pod template's node selector, so this must resolve to
  # the one machine with the arm attached.
  robot_platform: so101-edge
  policy_platform: l40s
  robot_port: /dev/ttyACM0
  front_camera: /dev/video2
  wrist_camera: /dev/video4
  camera_width: 640
  camera_height: 480
  camera_fps: 30
  # LeRobot looks for <robot_id>.json under the calibration directory.
  robot_id: follower
  # Optional: a local calibration file to inject. Without it the servos' own EEPROM is used,
  # which must match what the recording was calibrated with.
  calibration_localpath: ""

  policy_cpu: 4
  policy_memory_gi: 48
  policy_storage_gi: 80
  robot_cpu: 1
  robot_memory_gi: 6
  robot_storage_gi: 10

  server_image: nvcr.io/nvidia/pytorch:25.04-py3
  # A slim image on the robot side: that machine has no GPU and the download crosses a lab's
  # own internet link.
  client_image: public.ecr.aws/docker/library/python:3.12-slim
  # The client's LeRobot pin is the one it was validated against, and it is what defines this
  # arm's calibrated joint space — deliberately NOT the server's newer pin. The two tasks run
  # different LeRobot versions on purpose: the client's pins the joint space, the server's
  # pins the policy.
  client_lerobot_commit: 9021d2d24036e048b455d55919630e6e97394830
  torch_version: 2.10.0
  torchvision_version: 0.25.0
  pyzmq_version: 27.0.1
  msgpack_version: 1.1.0
  exec_timeout: 2h

workflow:
  name: so101-pi0fast-hil-eval
  resources:
    policy:
      platform: "{{ policy_platform }}"
      gpu: 1
      cpu: {{ policy_cpu }}
      memory: {{ policy_memory_gi }}Gi
      storage: {{ policy_storage_gi }}Gi
    robot:
      platform: "{{ robot_platform }}"
      cpu: {{ robot_cpu }}
      memory: {{ robot_memory_gi }}Gi
      storage: {{ robot_storage_gi }}Gi

  groups:
  # One group, so the two tasks are gang-scheduled: the client cannot start without a server
  # to talk to, and a server without a client is a GPU burning for nothing.
  - name: hil
    tasks:
    - name: policy-server
      image: "{{ server_image }}"
      resource: policy
      credentials:
        huggingface_token:
          HF_TOKEN: token
      inputs:
      - url: "{{ checkpoint_url }}"
      - url: "{{ dataset_url }}"
      files:
      - localpath: files/pi0fast/install_pi0fast.sh
        path: /tmp/install_pi0fast.sh
      - localpath: files/pi0fast/zmq_transport.py
        path: /tmp/zmq_transport.py
      - localpath: files/pi0fast/serve_policy.py
        path: /tmp/serve_policy.py
      command: [bash, -c]
      args:
        - |
          set -euo pipefail

          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
          # ffmpeg is for torchcodec: without libav* its library fails to load and LeRobot
          # falls back to another decoder, so the served policy would see frames decoded
          # differently than the ones it trained on.
          apt-get update -qq && apt-get install -y -qq curl ffmpeg

          for repo in google/paligemma-3b-pt-224 lerobot/fast-action-tokenizer; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              "https://huggingface.co/api/models/${repo}")"
            echo "HF ${repo}: ${code}"
            if [ "${code}" != "200" ]; then
              echo "ERROR: cannot read ${repo} (HTTP ${code}); accept its terms as the token's account" >&2
              exit 2
            fi
          done

          curl -fsSL https://astral.sh/uv/install.sh | sh
          export PATH="${HOME}/.local/bin:${PATH}"
          source /tmp/install_pi0fast.sh
          uv pip install "pyzmq=={{ pyzmq_version }}" "msgpack=={{ msgpack_version }}"

          CKPT="$(dirname "$(find {{input:0}} -name config.json -print -quit)")"
          [ -n "${CKPT}" ] || { echo "ERROR: no config.json under {{input:0}}" >&2; exit 1; }
          DS="$(dirname "$(dirname "$(find {{input:1}} -name info.json -path '*/meta/*' -print -quit)")")"
          [ -n "${DS}" ] || { echo "ERROR: no meta/info.json under {{input:1}}" >&2; exit 1; }
          echo "checkpoint: ${CKPT}"
          echo "dataset:    ${DS}"

          # -u because a block-buffered traceback is lost when the group tears down: the
          # client is `lead`, so this task is killed the moment the client exits.
          PYTHONPATH=/tmp python -u /tmp/serve_policy.py \
            --checkpoint "${CKPT}" \
            --dataset-root "${DS}" \
            --repo-id "{{ repo_id }}" \
            --port {{ policy_port }} \
            --jitter-deg {{ jitter_deg }}

    - name: robot-client
      # lead: true on the client, not the server. The client is the thing that finishes; the
      # server would run forever. Its exit ends the group and tears the GPU task down with it.
      lead: true
      image: "{{ client_image }}"
      resource: robot
      # Without it every device open fails on the container device cgroup, while the device
      # itself looks present and correctly owned.
      privileged: true
      volumeMounts:
        - "{{ robot_port }}"
        - "{{ front_camera }}"
        - "{{ wrist_camera }}"
      outputs:
      - url: "{{ storage_url }}/hil/pi0fast/{{workflow_id}}/"
      files:
      # The validated client, by relative path. NOT copied: everything below `ArmDriver` in
      # it is hardware safety that must not exist in two versions.
      - localpath: ../so101-vla/files/eval_so101_bounded.py
        path: /tmp/eval_so101_bounded.py
      - localpath: files/pi0fast/zmq_transport.py
        path: /tmp/zmq_transport.py
{% if calibration_localpath %}
      - localpath: {{ calibration_localpath }}
        path: /tmp/calibration/{{ robot_id }}.json
{% endif %}
      command: [bash, -c]
      args:
        - |
          set -euo pipefail

          # Output URLs are not validated at submit time, so without this a forgotten --set
          # fails at upload, after the arm has already moved.
          case "{{ storage_url }}" in
            *REPLACE-WITH-*)
              echo "ERROR: pass --set storage_url=s3://<bucket>/so101-pi0fast" >&2
              exit 2 ;;
          esac
          case "{{ lang_instruction }}" in
            *REPLACE-WITH-*)
              echo "ERROR: pass --set lang_instruction='<the task text your dataset was annotated with>'" >&2
              exit 2 ;;
          esac

          apt-get update -qq
          apt-get install -y -qq libgl1 libglib2.0-0 curl

          # CPU wheels deliberately. lerobot imports torch transitively, so it cannot be
          # skipped, and the CUDA build is ~2.5 GB of no use on a machine with no GPU —
          # which matters when the download crosses a lab's own internet link.
          pip install --quiet --root-user-action=ignore \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch=={{ torch_version }}" "torchvision=={{ torchvision_version }}"

          # One resolve, not several: installed separately, packages silently downgrade each
          # other's huggingface-hub. No policy framework here and no second model's package —
          # the transport is /tmp/zmq_transport.py, which needs only pyzmq and msgpack.
          pip install --quiet --root-user-action=ignore \
            "lerobot[feetech] @ https://github.com/huggingface/lerobot/archive/{{ client_lerobot_commit }}.tar.gz" \
            "pyzmq=={{ pyzmq_version }}" \
            "msgpack=={{ msgpack_version }}"

          # Conditional flags go into an array rather than into the command's own backslash
          # continuation. A conditional block that renders to nothing still leaves a blank
          # line, and a blank line after a trailing backslash ends the command early.
          EXTRA=()
{% if calibration_localpath %}
          EXTRA+=(--calibration-dir /tmp/calibration)
{% endif %}
{% if no_motion | string | lower == 'true' %}
          EXTRA+=(--no-motion)
{% endif %}
{% if home_pose %}
          EXTRA+=(--home-pose "{{ home_pose }}" --home-ramp-s {{ home_ramp_s }})
{% endif %}
          echo "extra arguments: ${EXTRA[*]-none}"

          # PYTHONPATH so `--transport-module zmq_transport` resolves to this pipeline's
          # transport rather than the client's default.
          export PYTHONPATH=/tmp
          # pipefail is set, so the eval still fails the task despite the tee.
          python /tmp/eval_so101_bounded.py \
            --transport-module zmq_transport \
            --policy-host {{host:policy-server}} \
            --policy-port {{ policy_port }} \
            --policy-timeout-ms {{ policy_timeout_ms }} \
            --policy-setup-timeout-s {{ policy_setup_timeout_s }} \
            --policy-wait-s {{ policy_wait_s }} \
            --policy-retries {{ policy_retries }} \
            --robot-port {{ robot_port }} \
            --robot-id {{ robot_id }} \
            --front-camera {{ front_camera }} \
            --wrist-camera {{ wrist_camera }} \
            --camera-width {{ camera_width }} \
            --camera-height {{ camera_height }} \
            --camera-fps {{ camera_fps }} \
            --joint-margin-deg {{ joint_margin_deg }} \
            --gripper-margin {{ gripper_margin }} \
            --max-step-deg {{ max_step_deg }} \
            --max-step-gripper {{ max_step_gripper }} \
            --acceleration {{ acceleration }} \
            --speed {{ speed }} \
            --command-deadband-deg {{ command_deadband_deg }} \
            --command-deadband-gripper {{ command_deadband_gripper }} \
            --max-servo-temp-c {{ max_servo_temp_c }} \
            --temp-confirm-reads {{ temp_confirm_reads }} \
            --resume-servo-temp-c {{ resume_servo_temp_c }} \
            --cooldown-timeout-s {{ cooldown_timeout_s }} \
            --max-cooldowns {{ max_cooldowns }} \
            --release-settle-s {{ release_settle_s }} \
            --release-ramp-s {{ release_ramp_s }} \
            "${EXTRA[@]}" \
            --action-horizon {{ action_horizon }} \
            --control-hz {{ control_hz }} \
            --run-duration-s {{ run_duration_s }} \
            --interval-s {{ interval_s }} \
            --lang-instruction "{{ lang_instruction }}" \
            --output-dir {{output}} 2>&1 | tee {{output}}/hil_eval.log

          # The task runs as root, the uploading sidecar does not, so anything written via
          # tempfile is mode 0600 and silently unreadable to it — logged as a per-file error,
          # then reported as uploaded.
          chmod -R a+rX {{output}}
          echo "files to upload: $(find {{output}} -type f | wc -l)"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
