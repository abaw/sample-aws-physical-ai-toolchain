# Dependabot version updates for sample-aws-physical-ai-toolchain, generated by
# quinn-suite skills/validate/scripts/dependabot_rollout.py (qs-x4gs). Alerts alone never
# open PRs; this file does. Security updates only, one PR per ecosystem: the repo has no
# CI to prove a version bump green, so version updates are off (qs-33lw4).
# Re-run the script to regenerate after adding a manifest.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/cdk"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/containers/gr00t-inference"
      - "/containers/gr00t-training"
      - "/containers/inference"
      - "/containers/isaac-lab"
      - "/containers/isaac-sim"
      - "/containers/mujoco"
      - "/notebooks/lab1/container"
      - "/notebooks/lab4/container"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
